aid: galileo-technologies
name: Galileo Technologies
description: >-
  Galileo (Galileo Technologies Inc., formerly Rungalileo) is an AI observability
  and evaluation platform for teams building generative-AI applications and agents.
  Its REST API and Python/TypeScript SDKs let developers log traces and spans, run
  offline experiments and evaluations, create datasets and prompt templates, define
  LLM/code/preset scorers and metrics, monitor production log streams, configure
  alerts and generic webhooks, and apply runtime guardrails (Protect). The platform
  centralizes evaluation metrics, real-time observability, and runtime protection so
  offline evals can become production guardrails. Galileo Technologies is backed by
  Battery Ventures and Scale Venture Partners.
