- name: get_logstream_insights
  description: "Get the insights (also known as signals) for a log stream in a specific project. This\
    \ tool analyzes log streams and provides insights/signals that identify issues, patterns, and suggest\
    \ improvements.\n\n**When to use this tool:**\n- User asks for \"insights\" or \"signals\" about a\
    \ log stream\n- User mentions a project name and wants to analyze a log stream\n- User asks questions\
    \ like: \"What's wrong with my application?\", \"Get insights about my log stream\", \"Show me signals\
    \ for my logs\"\n\n**Parameters:**\n- project (required): The exact name of the Galileo project. Extract\
    \ this from phrases like:\n  - \"in the {project} project\"\n  - \"for project {project}\"\n  - \"\
    from {project}\"\n  Example: If user says \"in the customer-support project\", use project=\"customer-support\"\
    \n\n- log_stream (required): The exact name of the log stream. Extract this from phrases like:\n \
    \ - \"log stream {log_stream}\"\n  - \"logs from {log_stream}\"\n  - \"the {log_stream} log stream\"\
    \n  - If user says \"my log stream\" without a name, ask them for the specific log stream name\n \
    \ Example: If user says \"about my log stream in customer-support\", you may need to ask for the log\
    \ stream name, or infer it from context\n\n**Example Natural Language Queries:**\n- \"Get insights\
    \ about my log stream in the customer-support project\"\n  → project=\"customer-support\", log_stream={ask\
    \ user or infer from context}\n\n- \"Get insights for the api-logs log stream in customer-support\"\
    \n  → project=\"customer-support\", log_stream=\"api-logs\"\n\n- \"What insights do you have for my\
    \ logs in project customer-support?\"\n  → project=\"customer-support\", log_stream={ask user for\
    \ specific log stream name}\n\n**Returns:**\n- A list of insights/signals about the log stream, including:\n\
    \  - Issues and anomalies detected\n  - Patterns and trends\n  - Suggested improvements\n  - Session\
    \ notes and trace notes if available"
