          - partial
          - unavailable
          title: Cost Data Status
        provider_breakdown:
          items:
            $ref: '#/components/schemas/TokenomicsTeamProviderBreakdown'
          type: array
          title: Provider Breakdown
      type: object
      required:
      - user_key
      - has_children
      - direct_report_count
      - subtree_headcount
      - active_users
      - cost_data_status
