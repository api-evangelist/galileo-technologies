components:
  schemas:
    TokenomicsCanonicalUsersResponse:
      properties:
        date_range:
          $ref: '#/components/schemas/TokenomicsDateRange'
        directory:
          $ref: '#/components/schemas/TokenomicsDirectorySnapshot'
        data_freshness:
          $ref: '#/components/schemas/TokenomicsDataFreshnessV1'
        users:
          items:
            $ref: '#/components/schemas/TokenomicsCanonicalUserRow'
          type: array
          title: Users
        unmatched:
          anyOf:
          - $ref: '#/components/schemas/TokenomicsUnmatchedSummary'
          - type: 'null'
        pagination:
          $ref: '#/components/schemas/TokenomicsUsersPagination'
      type: object
      required:
      - date_range
      - directory
      - data_freshness
      - users
      - pagination
      title: TokenomicsCanonicalUsersResponse
    TokenomicsAccessContextResponse:
      properties:
        allowed_views:
          items:
            type: string
            enum:
            - individual
            - team
            - organization
          type: array
          maxItems: 3
          minItems: 1
          title: Allowed Views
        default_view:
          type: string
          enum:
          - individual
          - team
          - organization
          title: Default View
        directory_ready:
          type: boolean
          title: Directory Ready
      type: object
      required:
      - allowed_views
      - default_view
      - directory_ready
      title: TokenomicsAccessContextResponse
    TokenomicsFiscalTimeRange:
      properties:
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
      additionalProperties: false
      type: object
      required:
      - start_date
      - end_date
      title: TokenomicsFiscalTimeRange
    TokenomicsTeamRollupResponse:
      properties:
        date_range:
          $ref: '#/components/schemas/TokenomicsDateRange'
        directory:
          $ref: '#/components/schemas/TokenomicsDirectorySnapshot'
        data_freshness:
          $ref: '#/components/schemas/TokenomicsDataFreshnessV1'
        groups:
          items:
            $ref: '#/components/schemas/TokenomicsTeamRollupGroup'
          type: array
          title: Groups
      type: object
      required:
      - date_range
      - directory
      - data_freshness
      - groups
      title: TokenomicsTeamRollupResponse
    TokenomicsTeamChildRow:
      properties:
        user_key:
          type: string
          title: User Key
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        department:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
        job_function:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Function
        has_children:
          type: boolean
          title: Has Children
        is_manager_self:
          type: boolean
          title: Is Manager Self
          default: false
        direct_report_count:
          type: integer
          title: Direct Report Count
        subtree_headcount:
          type: integer
          title: Subtree Headcount
        active_users:
          type: integer
          title: Active Users
        usage_cost_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Usage Cost Usd
        total_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Tokens
        usage_cost_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Usage Cost Pct
        active_users_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Active Users Pct
        cost_data_status:
          type: string
          enum:
