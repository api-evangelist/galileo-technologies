openapi: 3.2.0
info:
  title: Galileo API Server Component Views API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: component_views
paths:
  /projects/{project_id}/views:
    get:
      tags:
      - component_views
      summary: List Views
      description: 'List all views the user can see for a component.


        Returns:

        - User''s user views

        - All project-visible views (if visibility filter allows)


        Note: If no project views exist for the scope, a default project-visible view

        is automatically created. This ensures every user sees at least one shared view.'
      operationId: list_views_projects__project_id__views_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: component
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ComponentType'
          description: Component type (e.g. 'logstream_table')
        description: Component type (e.g. 'logstream_table')
      - name: run_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          description: Required run ID
          title: Run Id
        description: Required run ID
      - name: visibility
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ViewVisibility'
          - type: 'null'
          description: 'Filter by visibility: ''user'', ''project'', or null for all'
          title: Visibility
        description: 'Filter by visibility: ''user'', ''project'', or null for all'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentViewResponse'
                title: Response List Views Projects  Project Id  Views Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - component_views
      summary: Create View
      description: 'Create a new component view.


        If this is the first view for the scope, it will automatically be set as default.


        Permissions:

        - User views: Any project collaborator can create

        - Project views: Only owner/editor can create'
      operationId: create_view_projects__project_id__views_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentViewCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentViewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/views/{view_id}:
    get:
      tags:
      - component_views
      summary: Get View
      description: 'Get a specific view by ID.


        Permissions:

        - User views: Only creator can view

        - Project views: Any project collaborator can view'
      operationId: get_view_projects__project_id__views__view_id__get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: view_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: View Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentViewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - component_views
      summary: Update View
      description: 'Update an existing component view (name, description, view_data, visibility).


        Note: To set a view as default, use a separate endpoint/mechanism.


        Permissions:

        - User views: Only creator can update

        - Project views: Owner/editor can update

        - Changing from PROJECT to USER visibility: Not allowed (blocked)

        - Changing visibility of a default view: Not allowed (must set another view as default first)

        - Changing to PROJECT visibility: Requires editor+ permission'
      operationId: update_view_projects__project_id__views__view_id__put
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: view_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: View Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentViewUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentViewResponse'
        '403':
          description: 'Error 9011: sharing permission is required to change a linked access view filter.'
        '409':
          description: 'Error 9004: a view with this name already exists.'
        '422':
          description: 'Errors 9010, 9023, or 9024: filters must be supported and valid for the view and access level.'
    delete:
      tags:
      - component_views
      summary: Delete View
      description: 'Delete a component view.


        Permissions:

        - User views: Only creator can delete

        - Project views: Only owner/editor can delete'
      operationId: delete_view_projects__project_id__views__view_id__delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: view_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: View Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: 'Error 9012: sharing permission is required to delete a linked access view.'
        '409':
          description: 'Error 9009: deletion would remove the last view required by a restricted access level.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/views/{view_id}/set-default:
    post:
      tags:
      - component_views
      summary: Set View As Default
      description: 'Set a view as the default for its scope.


        This will automatically unset any other default in the same scope.


        Permissions:

        - User views: Only creator can set as default

        - Project views: Owner/editor can set as default'
      operationId: set_view_as_default_projects__project_id__views__view_id__set_default_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: view_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: View Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentViewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/views/{view_id}/duplicate:
    post:
      tags:
      - component_views
      summary: Duplicate View
      description: 'Duplicate a view.


        Creates a new view owned by the current user with copied view_data.


        Permissions:

        - Any user who can VIEW the view can duplicate it

        - If duplicating as project-visible, need owner/editor permission'
      operationId: duplicate_view_projects__project_id__views__view_id__duplicate_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: view_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: View Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentViewDuplicate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentViewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
