openapi: 3.2.0
info:
  title: Galileo API Server Playgrounds API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: playgrounds
paths:
  /projects/{project_id}/playgrounds:
    post:
      tags:
      - playgrounds
      summary: Create Playground
      description: 'Create a playground for a project, optionally seeded from an existing run.


        Args:

        body: Playground name, dataset, scorers and optional run to load.

        project: Project resolved from the URL.

        ctx: Async request context supplying the read session and current user.

        principal: Caller the optional run load is authorized against.


        Returns:

        The created playground.'
      operationId: create_playground_projects__project_id__playgrounds_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaygroundRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/playgrounds/{playground_id}:
    get:
      tags:
      - playgrounds
      summary: Get Playground
      description: 'Get a playground by ID.


        Args:

        playground: Playground resolved from the URL, verified to belong to the URL project.


        Returns:

        The playground.'
      operationId: get_playground_projects__project_id__playgrounds__playground_id__get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: playground_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Playground Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - playgrounds
      summary: Update Playground
      description: 'Update a playground''s name, dataset or scorers.


        Args:

        body: Fields to set on the playground.

        playground: Playground resolved from the URL, verified to belong to the URL project.

        ctx: Async request context supplying the read session and current user.


        Returns:

        The updated playground.'
      operationId: update_playground_projects__project_id__playgrounds__playground_id__patch
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: playground_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Playground Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaygroundRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - playgrounds
      summary: Delete Playground
      description: 'Delete a playground.


        Args:

        playground: Playground resolved from the URL, verified to belong to the URL project.


        Returns:

        A confirmation message naming the deleted playground.'
      operationId: delete_playground_projects__project_id__playgrounds__playground_id__delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: playground_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Playground Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/playgrounds/query:
    post:
      tags:
      - playgrounds
      summary: Query Playgrounds
      description: 'List a project''s playgrounds.


        Args:

        project: Project resolved from the URL.

        params: Filters and sort to apply.

        pagination: Page window to read.

        ctx: Async request context supplying the read session and current user.


        Returns:

        The requested page of playgrounds.'
      operationId: query_playgrounds_projects__project_id__playgrounds_query_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: starting_token
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Starting Token
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListPlaygroundParams'
              default:
                filters: []
                sort:
                  name: created_at
                  ascending: false
                  sort_type: column
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlaygroundResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/playgrounds/{playground_id}/reset:
    post:
      tags:
      - playgrounds
      summary: Reset Playground
      description: 'Reset a playground to its initial state.


        Args:

        playground: Playground resolved from the URL, verified to belong to the URL project.

        ctx: Async request context supplying the read session and current user.


        Returns:

        An empty 204 response.'
      operationId: reset_playground_projects__project_id__playgrounds__playground_id__reset_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: playground_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Playground Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/playgrounds/{playground_id}/scratch_dataset:
    patch:
      tags:
      - playgrounds
      summary: Update Playground Scratch Dataset
      description: 'Update the content of a scratch dataset.


        This endpoint works similarly to `PATCH /datasets/{dataset_id}/content`.


        Args:

        update_dataset_content_request: Rows to add, update or remove.

        if_match: ETag of the dataset, used as a version identifier.

        playground: Playground resolved from the URL, verified to belong to the URL project.

        ctx: Async request context supplying the read session and current user.


        Returns:

        An empty 204 response carrying the dataset''s new ETag.'
      operationId: update_playground_scratch_dataset_projects__project_id__playgrounds__playground_id__scratch_dataset_patch
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: playground_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Playground Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ETag of the dataset as a version identifier.
          examples:
          - d89cce33-549d-4b6d-b220-afb641d859c8
          title: If-Match
        description: ETag of the dataset as a version identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetContentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DatasetRenameColumn:
      properties:
        edit_type:
          type: string
          const: rename_column
          title: Edit Type
          default: rename_column
        column_name:
          type: string
          maxLength: 255
          title: Column Name
        new_column_name:
          type: string
          maxLength: 255
          title: New Column Name
      type: object
      required:
      - column_name
      - new_column_name
      title: DatasetRenameColumn
      description: Rename a column in the dataset schema, preserving values.
    ModelType:
      type: string
      enum:
      - slm
      - llm
      - code
      - decision
      title: ModelType
    NodeNameFilter:
      properties:
        name:
          type: string
          const: node_name
          title: Name
          default: node_name
        operator:
          type: string
          enum:
          - eq
          - ne
          - contains
          - one_of
          - not_in
          title: Operator
        value:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Value
        case_sensitive:
          type: boolean
          title: Case Sensitive
          default: true
      type: object
      required:
      - operator
      - value
      title: NodeNameFilter
      description: Filters on node names in scorer jobs.
    RollUpMethodDisplayOptions:
      type: string
      enum:
      - average
      - sum
      - max
      - min
      - category_count
      - percentage_true
      - percentage_false
      title: RollUpMethodDisplayOptions
      description: 'Display options for roll up methods when showing rolled up metrics in the UI.


        Separates display intent from computation methods. The computation methods

        (NumericRollUpMethod, CategoricalRollUpMethod) control what aggregations are available.

        This enum controls how the UI displays the selected roll-up value for a scorer.'
    BaseRegisteredScorerDB:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        score_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Score Type
      type: object
      required:
      - id
      - name
      title: BaseRegisteredScorerDB
    PlaygroundCreatedAtSort:
      properties:
        name:
          type: string
          const: created_at
          title: Name
          default: created_at
        ascending:
          type: boolean
          title: Ascending
          default: true
        sort_type:
          type: string
          const: column
          title: Sort Type
          default: column
      type: object
      title: PlaygroundCreatedAtSort
    PlaygroundDataset:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        version_index:
          type: integer
          title: Version Index
      type: object
      required:
      - id
      - version_index
      title: PlaygroundDataset
    DecisionBooleanCriteria:
      properties:
        'true':
          type: string
          title: 'True'
        'false':
          type: string
          title: 'False'
      additionalProperties: false
      type: object
      required:
      - 'true'
      - 'false'
      title: DecisionBooleanCriteria
      description: What a true answer and a false answer mean, for a yes/no question. The two are set together.
    DecisionLevel:
      properties:
        level:
          type: integer
          maximum: 9.0
          minimum: 0.0
          title: Level
        label:
          type: string
          title: Label
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - level
      - label
      title: DecisionLevel
      description: One level of a score question. A question's levels run 0, 1, 2 and so on, with no gaps.
    LunaOutputTypeEnum:
      type: string
      enum:
      - float
      - string
      - string_list
      - bool_list
      title: LunaOutputTypeEnum
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UserInfo:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        email:
          type: string
          title: Email
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
      type: object
      required:
      - id
      - email
      title: UserInfo
      description: A user's basic information, used for display purposes.
    ChainPollTemplate:
      properties:
        metric_system_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric System Prompt
          description: System prompt for the metric.
        metric_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric Description
          description: Description of what the metric should do.
        value_field_name:
          type: string
          title: Value Field Name
          description: Field name to look for in the chainpoll response, for the rating.
          default: rating
        explanation_field_name:
          type: string
          title: Explanation Field Name
          description: Field name to look for in the chainpoll response, for the explanation.
          default: explanation
        template:
          type: string
          title: Template
          description: Chainpoll prompt template.
        metric_few_shot_examples:
          items:
            $ref: '#/components/schemas/FewShotExample'
          type: array
          title: Metric Few Shot Examples
          description: Few-shot examples for the metric.
        response_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Response Schema
          description: Response schema for the output
      type: object
      required:
      - template
      title: ChainPollTemplate
      description: 'Template for a chainpoll metric prompt,

        containing all the info necessary to send a chainpoll prompt.'
    BaseFinetunedScorerDB:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        lora_task_id:
          type: integer
          title: Lora Task Id
        lora_weights_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Lora Weights Path
        prompt:
          type: string
          title: Prompt
        luna_input_type:
          anyOf:
          - $ref: '#/components/schemas/LunaInputTypeEnum'
          - type: 'null'
        luna_output_type:
          anyOf:
          - $ref: '#/components/schemas/LunaOutputTypeEnum'
          - type: 'null'
        class_name_to_vocab_ix:
          anyOf:
          - additionalProperties:
              items:
                type: integer
              type: array
              uniqueItems: true
            type: object
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Class Name To Vocab Ix
        executor:
          anyOf:
          - $ref: '#/components/schemas/ScorerName'
          - type: 'null'
          description: Executor pipeline. Defaults to finetuned scorer pipeline but can run custom galileo score pipelines.
      type: object
      required:
      - id
      - name
      - lora_task_id
      - prompt
      title: BaseFinetunedScorerDB
    ModalityFilter:
      properties:
        name:
          type: string
          const: modality
          title: Name
          default: modality
        operator:
          type: string
          enum:
          - eq
          - ne
          - one_of
          - not_in
          title: Operator
        value:
          anyOf:
          - type: string
            description: Single enum value - specific options depend on the concrete enum type used
            example: ENUM_VALUE
          - items:
              type: string
              example: ENUM_VALUE
            type: array
            description: Array of enum values
            example:
            - ENUM_VALUE_1
            - ENUM_VALUE_2
          title: Value
      type: object
      required:
      - operator
      - value
      title: ModalityFilter
      description: 'Filters on content modalities in scorer jobs.

        Matches if at least one of the specified modalities is present.'
    BaseGeneratedScorerDB:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
        chain_poll_template:
          $ref: '#/components/schemas/ChainPollTemplate'
        user_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: User Prompt
      type: object
      required:
      - id
      - name
      - chain_poll_template
      title: BaseGeneratedScorerDB
    PlaygroundNameSort:
      properties:
        name:
          type: string
          const: name
          title: Name
          default: name
        ascending:
          type: boolean
          title: Ascending
          default: true
        sort_type:
          type: string
          const: column
          title: Sort Type
          default: column
      type: object
      title: PlaygroundNameSort
    DatasetUpdateRow:
      properties:
        row_id:
          type: string
          format: uuid4
          title: Row Id
        edit_type:
          type: string
          const: update_row
          title: Edit Type
          default: update_row
        values:
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - additionalProperties:
                anyOf:
                - type: string
                - type: integer
                - type: number
                - type: 'null'
              type: object
            - type: 'null'
          type: object
          title: Values
      type: object
      required:
      - row_id
      - values
      title: DatasetUpdateRow
    LunaInputTypeEnum:
      type: string
      enum:
      - span
      - trace_object
      - trace_input_output_only
      title: LunaInputTypeEnum
    ScorerTypes:
      type: string
      enum:
      - llm
      - code
      - luna
      - decision
      - preset
      title: ScorerTypes
    MetadataFilter:
      properties:
        name:
          type: string
          const: metadata
          title: Name
          default: metadata
        operator:
          type: string
          enum:
          - one_of
          - not_in
          - eq
          - ne
          title: Operator
        key:
          type: string
          title: Key
        value:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Value
      type: object
      required:
      - operator
      - key
      - value
      title: MetadataFilter
      description: Filters on metadata key-value pairs in scorer jobs.
    PlaygroundResponse:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        created_by_user:
          anyOf:
          - $ref: '#/components/schemas/UserInfo'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        dataset:
          anyOf:
          - $ref: '#/components/schemas/PlaygroundDataset'
          - type: 'null'
        scratch_dataset_id:
          type: string
          format: uuid4
          title: Scratch Dataset Id
        scorers:
          anyOf:
          - items:
              $ref: '#/components/schemas/RuntimeScorerConfig'
            type: array
          - type: 'null'
          title: Scorers
      type: object
      required:
      - id
      - name
      - created_by_user
      - created_at
      - updated_at
      - dataset
      - scratch_dataset_id
      - scorers
      title: PlaygroundResponse
    InputTypeEnum:
      type: string
      enum:
      - basic
      - llm_spans
      - retriever_spans
      - sessions_normalized
      - sessions_trace_io_only
      - tool_spans
      - trace_input_only
      - trace_io_only
      - trace_normalized
      - trace_output_only
      - agent_spans
      - workflow_spans
      title: InputTypeEnum
      description: Enumeration of input types.
    DatasetDeleteRow:
      properties:
        row_id:
          type: string
          format: uuid4
          title: Row Id
        edit_type:
          type: string
          const: delete_row
          title: Edit Type
          default: delete_row
      type: object
      required:
      - row_id
      title: DatasetDeleteRow
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    CreatePlaygroundRequest:
      properties:
        name:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/Name'
          title: Name
        run_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Run Id
          description: Optional run ID to initialize the playground with existing run data.
      type: object
      required:
      - name
      title: CreatePlaygroundRequest
    FewShotExample:
      properties:
        generation_prompt_and_response:
          type: string
          title: Generation Prompt And Response
        evaluating_response:
          type: string
          title: Evaluating Response
      type: object
      required:
      - generation_prompt_and_response
      - evaluating_response
      title: FewShotExample
      description: Few-shot example for a chainpoll metric prompt.
    BaseMetricRollUpConfigDB:
      properties:
        roll_up_methods:
          anyOf:
          - items:
              $ref: '#/components/schemas/NumericRollUpMethod'
            type: array
          - items:
              $ref: '#/components/schemas/CategoricalRollUpMethod'
            type: array
          minLength: 1
          title: Roll Up Methods
          description: List of roll up methods to apply to the metric. For numeric scorers we support doing multiple roll up types per metric.
      type: object
      required:
      - roll_up_methods
      title: BaseMetricRollUpConfigDB
      description: Configuration for rolling up metrics to parent/trace/session.
    RuntimeScorerConfig:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        scorer_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Scorer Version Id
        filters:
          anyOf:
          - items:
              oneOf:
              - $ref: '#/components/schemas/NodeNameFilter'
              - $ref: '#/components/schemas/MetadataFilter'
              - $ref: '#/components/schemas/ModalityFilter'
              discriminator:
                propertyName: name
                mapping:
                  metadata: '#/components/schemas/MetadataFilter'
                  modality: '#/components/schemas/ModalityFilter'
                  node_name: '#/components/schemas/NodeNameFilter'
            type: array
          - type: 'null'
          title: Filters
          description: List of filters to apply to the scorer.
        roll_up_method:
          anyOf:
          - $ref: '#/components/schemas/RollUpMethodDisplayOptions'
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        scorer_type:
          anyOf:
          - $ref: '#/components/schemas/ScorerTypes'
          - type: 'null'
        model_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Name
        num_judges:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Judges
        scorer_version:
          anyOf:
