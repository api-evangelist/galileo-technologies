      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: queue_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Queue Id
      - name: user_id
        in: path
        required: true
