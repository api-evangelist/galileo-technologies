      description: Count annotation queues in the user's organization with filtering.
      operationId: count_annotation_queues_annotation_queues_count_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAnnotationQueueParams'
              default:
                filters: []
                sort:
                  name: created_at
                  ascending: false
                  sort_type: column
      responses:
