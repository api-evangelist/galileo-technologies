openapi: 3.2.0
info:
  title: Galileo API Server Assistant API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: Assistant
paths:
  /assistant/mentions:
    get:
      tags:
      - Assistant
      summary: Search Mentions
      description: 'Search entities by name for @-mention autocomplete in the assistant.


        Returns up to 20 results per entity type. Logstreams and experiments are only

        returned when project_id is provided.'
      operationId: search_mentions_assistant_mentions_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 0
          maxLength: 200
          description: Name search query. Empty string returns up to 20 results per type.
          title: Q
        description: Name search query. Empty string returns up to 20 results per type.
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          description: Scope to a specific project. Required for logstream and experiment results.
          title: Project Id
        description: Scope to a specific project. Required for logstream and experiment results.
      - name: types
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/AssistantContextType'
          - type: 'null'
          description: Entity types to include. Defaults to all applicable for the given scope.
          title: Types
        description: Entity types to include. Defaults to all applicable for the given scope.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/suggested-questions:
    get:
      tags:
      - Assistant
      summary: Get Suggested Questions
      description: Return suggested questions for the assistant panel's current page.
      operationId: get_suggested_questions_assistant_suggested_questions_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: page_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Current assistant page identifier.
          title: Page Id
        description: Current assistant page identifier.
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          description: Active project ID.
          deprecated: true
          title: Project Id
        description: Active project ID.
        deprecated: true
      - name: logstream_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          description: Active logstream ID.
          deprecated: true
          title: Logstream Id
        description: Active logstream ID.
        deprecated: true
      - name: experiment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          description: Active experiment ID.
          deprecated: true
          title: Experiment Id
        description: Active experiment ID.
        deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedQuestionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/suggested-questions-by-page-id:
    get:
      tags:
      - Assistant
      summary: Get Suggested Questions By Page Id
      description: 'Return suggested questions keyed by page id.


        With no page_id, returns the map for every known page. With a page_id, returns a

        single-entry map for that page.'
      operationId: get_suggested_questions_by_page_id_assistant_suggested_questions_by_page_id_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: page_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Current assistant page identifier.
          title: Page Id
        description: Current assistant page identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedQuestionsByPageIdResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/warmup:
    post:
      tags:
      - Assistant
      summary: Warmup
      description: 'Warm up the assistant for a project, logstream or experiment.


        Call this when the user opens the assistant panel, before they send their first message.

        Returns 204. Safe to call multiple times.'
      operationId: warmup_assistant_warmup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarmupRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
  /assistant/background-tasks:
    post:
      tags:
      - Assistant
      summary: Upsert Background Task
      description: Create or update an assistant background task and linkage row.
      operationId: upsert_background_task_assistant_background_tasks_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAssistantBackgroundTaskRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantBackgroundTaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Assistant
      summary: List Background Tasks
      description: List the caller's background task linkage rows plus read-time derived statuses.
      operationId: list_background_tasks_assistant_background_tasks_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: task_name
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AssistantBackgroundTaskName'
          - type: 'null'
          title: Task Name
      - name: target_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AssistantBackgroundTaskTargetType'
          - type: 'null'
          title: Target Type
      - name: target_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Target Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantBackgroundTasksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/background-tasks/{task_name}/{target_type}/{target_id}:
    get:
      tags:
      - Assistant
      summary: Get Background Task
      description: Return the caller's background task linkage row plus read-time derived status.
      operationId: get_background_task_assistant_background_tasks__task_name___target_type___target_id__get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: task_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AssistantBackgroundTaskName'
      - name: target_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AssistantBackgroundTaskTargetType'
      - name: target_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Target Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantBackgroundTaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/conversations:
    get:
      tags:
      - Assistant
      summary: List Conversations
      description: List the caller's conversations, most recently updated first.
      operationId: list_conversations_assistant_conversations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConversationResponse'
                type: array
                title: Response List Conversations Assistant Conversations Get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
    post:
      tags:
      - Assistant
      summary: Create Conversation
      description: Create a new conversation owned by the caller.
      operationId: create_conversation_assistant_conversations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
  /assistant/conversations/{conversation_id}:
    patch:
      tags:
      - Assistant
      summary: Update Conversation
      description: Rename a conversation. 404 if it does not exist in the caller's org.
      operationId: update_conversation_assistant_conversations__conversation_id__patch
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Assistant
      summary: Delete Conversation
      description: Delete a conversation (cascades to its messages). 404 if it does not exist.
      operationId: delete_conversation_assistant_conversations__conversation_id__delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Conversation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/conversations/{conversation_id}/messages:
    get:
      tags:
      - Assistant
      summary: List Messages
      description: 'List a conversation''s messages, latest first, cursor-paginated.


        Pass `next_cursor` from a prior response back as `cursor` to load older messages.

        Cursor pagination is stable under concurrent writes - new messages can land at the

        head while the caller is scrolling back without causing duplicates or skipped rows.'
      operationId: list_messages_assistant_conversations__conversation_id__messages_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Conversation Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessagesPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Assistant
      summary: Send Message
      description: 'Send a message to the conversation and stream the assistant''s response as SSE events.


        404s if the conversation does not exist or is not owned by the caller. 409s if

        `message_id` was already submitted (the field is the client-side idempotency key).'
      operationId: send_message_assistant_conversations__conversation_id__messages_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/conversations/{conversation_id}/messages/{assistant_message_id}/stream:
    get:
      tags:
      - Assistant
      summary: Resume Message Stream
      description: Resume an assistant response stream by replaying the turn's Redis stream.
      operationId: resume_message_stream_assistant_conversations__conversation_id__messages__assistant_message_id__stream_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Conversation Id
      - name: assistant_message_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Assistant Message Id
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/conversations/{conversation_id}/messages/{message_id}/stop-response:
    post:
      tags:
      - Assistant
      summary: Stop Response
      description: 'Stop the in-progress assistant response started by `message_id`.


        Returns 204. The call is idempotent and is a no-op if the turn has already

        finished. 404s if the conversation does not exist or is not owned by the caller.'
      operationId: stop_response_assistant_conversations__conversation_id__messages__message_id__stop_response_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Conversation Id
      - name: message_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Message Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /assistant/messages/{message_id}/feedback:
    post:
      tags:
      - Assistant
      summary: Record Message Feedback
      description: 'Record feedback on an assistant message.


        Feedback can be positive or negative and optionally include a comment.

        Calling this endpoint again replaces any previous feedback on the same message.

        404s if the message does not exist or was not created by the authenticated user.'
      operationId: record_message_feedback_assistant_messages__message_id__feedback_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Message Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageFeedbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Assistant
      summary: Delete Message Feedback
      description: 'Remove feedback from an assistant message.


        No-ops gracefully if feedback was already absent.

        404s if the message does not exist or was not created by the authenticated user.'
      operationId: delete_message_feedback_assistant_messages__message_id__feedback_delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Message Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    MessageFeedbackRequest:
      properties:
        rating:
          $ref: '#/components/schemas/MessageFeedbackRating'
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
          description: Optional free-text comment.
      type: object
      required:
      - rating
      title: MessageFeedbackRequest
      description: Request body for submitting feedback on an assistant message.
    SpanContext:
      properties:
        type:
          type: string
          const: span
          title: Type
        id:
          type: string
          format: uuid4
          title: Id
          description: Span ID.
        trace_id:
          type: string
          format: uuid4
          title: Trace Id
          description: Trace the span belongs to.
        project_id:
          type: string
          format: uuid4
          title: Project Id
          description: Project the trace belongs to.
      type: object
      required:
      - type
      - id
      - trace_id
      - project_id
      title: SpanContext
      description: A specific span within a trace the user is viewing.
    ConversationMessageFinishReason:
      type: string
      enum:
      - stop
      - interrupted
      - max_tokens
      title: ConversationMessageFinishReason
      description: Why an assistant turn ended.
    libs__python__schemas__assistant__assistant__BooleanColorConstraint:
      properties:
        color:
          type: string
          enum:
          - red
          - yellow
          - green
          title: Color
        operator:
          type: string
          const: eq
          title: Operator
        value:
          type: boolean
          title: Value
      additionalProperties: false
      type: object
      required:
      - color
      - operator
      - value
      title: BooleanColorConstraint
    O11yThreadHandoff:
      properties:
        schema_version:
          type: string
          const: '1'
          title: Schema Version
          default: '1'
        messages:
          items:
            $ref: '#/components/schemas/O11yHandoffMessage'
          type: array
          maxItems: 30
          title: Messages
      type: object
      title: O11yThreadHandoff
      description: 'Earlier turns from the O11y thread, supplied for one turn only and never persisted.


        An embedding assistant owns the durable thread and delegates a single turn at a time, so it

        replays the relevant prior turns here instead of them living in Galileo conversation history.'
    SuggestedQuestionsResponse:
      properties:
        questions:
          items:
            type: string
          type: array
          title: Questions
      type: object
      required:
      - questions
      title: SuggestedQuestionsResponse
      description: Suggested questions the user can ask the assistant given the active context.
    AssistantContextType:
      type: string
      enum:
      - page
      - project
      - logstream
      - experiment
      - trace
      - span
      - signal
      title: AssistantContextType
      description: Discriminator for the active surface attached to an assistant turn.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AssistantBackgroundTasksResponse:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/AssistantBackgroundTaskListItem'
          type: array
          title: Tasks
      type: object
      required:
      - tasks
      title: AssistantBackgroundTasksResponse
      description: Background task linkage rows for the caller.
    AssistantBackgroundTaskTargetType:
      type: string
      enum:
      - experiment
      - logstream
      title: AssistantBackgroundTaskTargetType
    JobStatus:
      type: string
      enum:
      - unstarted
      - in_progress
      - processed
      - completed
      - error
      - failed
      title: JobStatus
    AssistantBackgroundTaskListItem:
      properties:
        conversation_id:
          type: string
          format: uuid4
          title: Conversation Id
        task_name:
          type: string
          title: Task Name
        target_type:
          type: string
          title: Target Type
        target_id:
          type: string
          format: uuid4
          title: Target Id
        status:
          anyOf:
          - $ref: '#/components/schemas/JobStatus'
          - type: string
            const: unknown
          title: Status
        job_run_summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Job Run Summary
      type: object
      required:
      - conversation_id
      - task_name
      - target_type
      - target_id
      - status
      title: AssistantBackgroundTaskListItem
      description: Background task fields needed by the assistant UI list/reload path.
    AssistantBackgroundTaskName:
      type: string
      enum:
      - generate-signals
      title: AssistantBackgroundTaskName
    ControlDraftCondition:
      properties:
        selector_path:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Selector Path
          description: 'Leaf only. Field the evaluator reads, e.g. ''output'', ''input'', ''context.user_id'' or ''*''. Must be consistent with the chosen stages: ''output'' is unavailable in the ''pre'' stage.'
        evaluator_name:
          anyOf:
          - type: string
            enum:
            - regex
            - list
            - json
            - sql
            - galileo.luna
          - type: 'null'
          title: Evaluator Name
          description: Leaf only. Which code-based or model-based evaluator to run.
        evaluator_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Evaluator Config
          description: Leaf only. Config for the chosen evaluator, matching that evaluator's schema exactly. Validated against the real Agent Control evaluator config before the draft is shown.
        and:
          anyOf:
          - items:
              $ref: '#/components/schemas/ControlDraftCondition'
            type: array
            minItems: 2
          - type: 'null'
          title: And
          description: Branch. All child conditions must match. Use for 'X and Y'.
        or:
          anyOf:
          - items:
              $ref: '#/components/schemas/ControlDraftCondition'
            type: array
            minItems: 2
          - type: 'null'
          title: Or
          description: Branch. Any child condition matching is enough. Use for 'X or Y'.
        not:
          anyOf:
          - $ref: '#/components/schemas/ControlDraftCondition'
          - type: 'null'
          description: Branch. Inverts the child condition. Use for 'X without Y' together with 'and'.
      additionalProperties: false
      type: object
      title: ControlDraftCondition
      description: 'Recursive boolean condition tree for a drafted control.


        Mirrors the engine''s `ConditionNode` (agent_control_models.controls) and the UI''s editor tree, so a

        multi-evaluator control survives the round trip draft -> form -> server. A node is either a leaf

        (selector_path + evaluator) or exactly one boolean branch.'
    ConversationMessageStatus:
      type: string
      enum:
      - in_progress
      - success
      - failed
      title: ConversationMessageStatus
      description: 'Runner-reported state of an assistant message turn.


