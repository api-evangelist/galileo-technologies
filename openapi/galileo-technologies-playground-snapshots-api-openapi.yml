openapi: 3.2.0
info:
  title: Galileo API Server Playground Snapshots API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: playground_snapshots
paths:
  /projects/{project_id}/playgrounds/{playground_id}/snapshots/query:
    post:
      tags:
      - playground_snapshots
      summary: Query Snapshots
      description: 'List a playground''s snapshots.


        Args:

        ctx: Async request context supplying the read session and current user.

        playground: Playground resolved from the URL, verified to belong to the URL project.

        pagination: Page window to read.

        params: Sort to apply.


        Returns:

        The requested page of snapshots.'
      operationId: query_snapshots_projects__project_id__playgrounds__playground_id__snapshots_query_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: playground_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Playground Id
      - name: starting_token
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Starting Token
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListPlaygroundSnapshotsParams'
              default:
                sort:
                  name: created_at
                  ascending: false
                  sort_type: column
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlaygroundSnapshotsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/playgrounds/{playground_id}/snapshots/{snapshot_id}:
    delete:
      tags:
      - playground_snapshots
      summary: Delete Playground Snapshot
      description: 'Delete a playground snapshot.


        Args:

        snapshot: Snapshot resolved from the URL, verified to belong to the URL playground.


        Returns:

        A confirmation message naming the deleted snapshot.'
      operationId: delete_playground_snapshot_projects__project_id__playgrounds__playground_id__snapshots__snapshot_id__delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Snapshot Id
      - name: playground_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Playground Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/playgrounds/{playground_id}/snapshots/{snapshot_id}/load:
    post:
      tags:
      - playground_snapshots
      summary: Load Playground Snapshot
      description: 'Reset a playground to the state its snapshot captured.


        Args:

        ctx: Async request context supplying the read session and current user.

        playground: Playground resolved from the URL, verified to belong to the URL project.

        snapshot: Snapshot resolved from the URL, verified to belong to that playground.

        principal: Caller the snapshot''s run is authorized against.


        Returns:

        The restored playground.'
      operationId: load_playground_snapshot_projects__project_id__playgrounds__playground_id__snapshots__snapshot_id__load_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: playground_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Playground Id
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Snapshot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ListPlaygroundSnapshotsResponse:
      properties:
        starting_token:
          type: integer
          title: Starting Token
          default: 0
        limit:
          type: integer
          title: Limit
          default: 100
        paginated:
          type: boolean
          title: Paginated
          default: false
        next_starting_token:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Starting Token
        snapshots:
          items:
            $ref: '#/components/schemas/PlaygroundSnapshotResponse'
          type: array
          title: Snapshots
      type: object
      required:
      - snapshots
      title: ListPlaygroundSnapshotsResponse
    ModelType:
      type: string
      enum:
      - slm
      - llm
      - code
      - decision
      title: ModelType
    ListPlaygroundSnapshotsParams:
      properties:
        sort:
          $ref: '#/components/schemas/PlaygroundSnapshotCreatedAtSort'
          default:
            name: created_at
            ascending: false
            sort_type: column
      type: object
      title: ListPlaygroundSnapshotsParams
    NodeNameFilter:
      properties:
        name:
          type: string
          const: node_name
          title: Name
          default: node_name
        operator:
          type: string
          enum:
          - eq
          - ne
          - contains
          - one_of
          - not_in
          title: Operator
        value:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Value
        case_sensitive:
          type: boolean
          title: Case Sensitive
          default: true
      type: object
      required:
      - operator
      - value
      title: NodeNameFilter
      description: Filters on node names in scorer jobs.
    RollUpMethodDisplayOptions:
      type: string
      enum:
      - average
      - sum
      - max
      - min
      - category_count
      - percentage_true
      - percentage_false
      title: RollUpMethodDisplayOptions
      description: 'Display options for roll up methods when showing rolled up metrics in the UI.


        Separates display intent from computation methods. The computation methods

        (NumericRollUpMethod, CategoricalRollUpMethod) control what aggregations are available.

        This enum controls how the UI displays the selected roll-up value for a scorer.'
    BaseRegisteredScorerDB:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        score_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Score Type
      type: object
      required:
      - id
      - name
      title: BaseRegisteredScorerDB
    PlaygroundDataset:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        version_index:
          type: integer
          title: Version Index
      type: object
      required:
      - id
      - version_index
      title: PlaygroundDataset
    DecisionBooleanCriteria:
      properties:
        'true':
          type: string
          title: 'True'
        'false':
          type: string
          title: 'False'
      additionalProperties: false
      type: object
      required:
      - 'true'
      - 'false'
      title: DecisionBooleanCriteria
      description: What a true answer and a false answer mean, for a yes/no question. The two are set together.
    DecisionLevel:
      properties:
        level:
          type: integer
          maximum: 9.0
          minimum: 0.0
          title: Level
        label:
          type: string
          title: Label
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - level
      - label
      title: DecisionLevel
      description: One level of a score question. A question's levels run 0, 1, 2 and so on, with no gaps.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LunaOutputTypeEnum:
      type: string
      enum:
      - float
      - string
      - string_list
      - bool_list
      title: LunaOutputTypeEnum
    PlaygroundSnapshotScorer:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - id
      title: PlaygroundSnapshotScorer
    UserInfo:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        email:
          type: string
          title: Email
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
      type: object
      required:
      - id
      - email
      title: UserInfo
      description: A user's basic information, used for display purposes.
    ChainPollTemplate:
      properties:
        metric_system_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric System Prompt
          description: System prompt for the metric.
        metric_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric Description
          description: Description of what the metric should do.
        value_field_name:
          type: string
          title: Value Field Name
          description: Field name to look for in the chainpoll response, for the rating.
          default: rating
        explanation_field_name:
          type: string
          title: Explanation Field Name
          description: Field name to look for in the chainpoll response, for the explanation.
          default: explanation
        template:
          type: string
          title: Template
          description: Chainpoll prompt template.
        metric_few_shot_examples:
          items:
            $ref: '#/components/schemas/FewShotExample'
          type: array
          title: Metric Few Shot Examples
          description: Few-shot examples for the metric.
        response_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Response Schema
          description: Response schema for the output
      type: object
      required:
      - template
      title: ChainPollTemplate
      description: 'Template for a chainpoll metric prompt,

        containing all the info necessary to send a chainpoll prompt.'
    BaseFinetunedScorerDB:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        lora_task_id:
          type: integer
          title: Lora Task Id
        lora_weights_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Lora Weights Path
        prompt:
          type: string
          title: Prompt
        luna_input_type:
          anyOf:
          - $ref: '#/components/schemas/LunaInputTypeEnum'
          - type: 'null'
        luna_output_type:
          anyOf:
          - $ref: '#/components/schemas/LunaOutputTypeEnum'
          - type: 'null'
        class_name_to_vocab_ix:
          anyOf:
          - additionalProperties:
              items:
                type: integer
              type: array
              uniqueItems: true
            type: object
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Class Name To Vocab Ix
        executor:
          anyOf:
          - $ref: '#/components/schemas/ScorerName'
          - type: 'null'
          description: Executor pipeline. Defaults to finetuned scorer pipeline but can run custom galileo score pipelines.
      type: object
      required:
      - id
      - name
      - lora_task_id
      - prompt
      title: BaseFinetunedScorerDB
    ModalityFilter:
      properties:
        name:
          type: string
          const: modality
          title: Name
          default: modality
        operator:
          type: string
          enum:
          - eq
          - ne
          - one_of
          - not_in
          title: Operator
        value:
          anyOf:
          - type: string
            description: Single enum value - specific options depend on the concrete enum type used
            example: ENUM_VALUE
          - items:
              type: string
              example: ENUM_VALUE
            type: array
            description: Array of enum values
            example:
            - ENUM_VALUE_1
            - ENUM_VALUE_2
          title: Value
      type: object
      required:
      - operator
      - value
      title: ModalityFilter
      description: 'Filters on content modalities in scorer jobs.

        Matches if at least one of the specified modalities is present.'
    BaseGeneratedScorerDB:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
        chain_poll_template:
          $ref: '#/components/schemas/ChainPollTemplate'
        user_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: User Prompt
      type: object
      required:
      - id
      - name
      - chain_poll_template
      title: BaseGeneratedScorerDB
    LunaInputTypeEnum:
      type: string
      enum:
      - span
      - trace_object
      - trace_input_output_only
      title: LunaInputTypeEnum
    ScorerTypes:
      type: string
      enum:
      - llm
      - code
      - luna
      - decision
      - preset
      title: ScorerTypes
    MetadataFilter:
      properties:
        name:
          type: string
          const: metadata
          title: Name
          default: metadata
        operator:
          type: string
          enum:
          - one_of
          - not_in
          - eq
          - ne
          title: Operator
        key:
          type: string
          title: Key
        value:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Value
      type: object
      required:
      - operator
      - key
      - value
      title: MetadataFilter
      description: Filters on metadata key-value pairs in scorer jobs.
    PlaygroundResponse:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        created_by_user:
          anyOf:
          - $ref: '#/components/schemas/UserInfo'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        dataset:
          anyOf:
          - $ref: '#/components/schemas/PlaygroundDataset'
          - type: 'null'
        scratch_dataset_id:
          type: string
          format: uuid4
          title: Scratch Dataset Id
        scorers:
          anyOf:
          - items:
              $ref: '#/components/schemas/RuntimeScorerConfig'
            type: array
          - type: 'null'
          title: Scorers
      type: object
      required:
      - id
      - name
      - created_by_user
      - created_at
      - updated_at
      - dataset
      - scratch_dataset_id
      - scorers
      title: PlaygroundResponse
    InputTypeEnum:
      type: string
      enum:
      - basic
      - llm_spans
      - retriever_spans
      - sessions_normalized
      - sessions_trace_io_only
      - tool_spans
      - trace_input_only
      - trace_io_only
      - trace_normalized
      - trace_output_only
      - agent_spans
      - workflow_spans
      title: InputTypeEnum
      description: Enumeration of input types.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    FewShotExample:
      properties:
        generation_prompt_and_response:
          type: string
          title: Generation Prompt And Response
        evaluating_response:
          type: string
          title: Evaluating Response
      type: object
      required:
      - generation_prompt_and_response
      - evaluating_response
      title: FewShotExample
      description: Few-shot example for a chainpoll metric prompt.
    BaseMetricRollUpConfigDB:
      properties:
        roll_up_methods:
          anyOf:
          - items:
              $ref: '#/components/schemas/NumericRollUpMethod'
            type: array
          - items:
              $ref: '#/components/schemas/CategoricalRollUpMethod'
            type: array
          minLength: 1
          title: Roll Up Methods
          description: List of roll up methods to apply to the metric. For numeric scorers we support doing multiple roll up types per metric.
      type: object
      required:
      - roll_up_methods
      title: BaseMetricRollUpConfigDB
      description: Configuration for rolling up metrics to parent/trace/session.
    RuntimeScorerConfig:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        scorer_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Scorer Version Id
        filters:
          anyOf:
          - items:
              oneOf:
              - $ref: '#/components/schemas/NodeNameFilter'
              - $ref: '#/components/schemas/MetadataFilter'
              - $ref: '#/components/schemas/ModalityFilter'
              discriminator:
                propertyName: name
                mapping:
                  metadata: '#/components/schemas/MetadataFilter'
                  modality: '#/components/schemas/ModalityFilter'
                  node_name: '#/components/schemas/NodeNameFilter'
            type: array
          - type: 'null'
          title: Filters
          description: List of filters to apply to the scorer.
        roll_up_method:
          anyOf:
          - $ref: '#/components/schemas/RollUpMethodDisplayOptions'
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        scorer_type:
          anyOf:
          - $ref: '#/components/schemas/ScorerTypes'
          - type: 'null'
        model_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Name
        num_judges:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Judges
        scorer_version:
          anyOf:
          - $ref: '#/components/schemas/BaseScorerVersionDB'
          - type: 'null'
          description: ScorerVersion to use for this scorer. If not provided, the latest version will be used.
        scoreable_node_types:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scoreable Node Types
          description: List of node types that can be scored by this scorer. Defaults to llm/chat.
        cot_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Cot Enabled
          description: Whether to enable chain of thought for this scorer. Defaults to False for llm scorers.
        output_type:
          anyOf:
          - $ref: '#/components/schemas/OutputTypeEnum'
          - type: 'null'
          description: What type of output to use for model-based scorers (boolean, categorical, etc.).
        input_type:
          anyOf:
          - $ref: '#/components/schemas/InputTypeEnum'
          - type: 'null'
          description: What type of input to use for model-based scorers (sessions_normalized, trace_io_only, etc..).
        multimodal_capabilities:
          anyOf:
          - items:
              $ref: '#/components/schemas/MultimodalCapability'
            type: array
          - type: 'null'
          title: Multimodal Capabilities
          description: Multimodal capabilities which this scorer can utilize in its evaluation.
        roll_up_config:
          anyOf:
          - $ref: '#/components/schemas/BaseMetricRollUpConfigDB'
          - type: 'null'
        score_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Score Type
          description: Return type of code scorers (e.g., 'bool', 'int', 'float', 'str').
        model_type:
          anyOf:
          - $ref: '#/components/schemas/ModelType'
          - type: 'null'
        invocation:
          anyOf:
          - $ref: '#/components/schemas/ScorerInvocationConfig'
          - type: 'null'
          description: Trusted intrinsic input requirements for synchronous direct invocation.
        chainpoll_template:
          anyOf:
          - $ref: '#/components/schemas/ChainPollTemplate'
          - type: 'null'
        metric_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric Name
        scorer_path_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Scorer Path Name
        user_code:
          anyOf:
          - type: string
          - type: 'null'
          title: User Code
        registered_scorer_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Registered Scorer Id
        model_alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Alias
        ground_truth:
          type: boolean
          title: Ground Truth
          default: false
        requires_tools_in_llm_span:
          type: boolean
          title: Requires Tools In Llm Span
          default: false
        default_model_alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Model Alias
        roll_up_strategy:
          anyOf:
          - $ref: '#/components/schemas/RollUpStrategy'
          - type: 'null'
        required_scorers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Required Scorers
        required_metric_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Required Metric Ids
        instruction:
          anyOf:
          - type: string
          - type: 'null'
          title: Instruction
        adapter:
          anyOf:
          - type: string
          - type: 'null'
          title: Adapter
        threshold:
          type: number
          title: Threshold
          default: 0.5
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
        lora_task_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lora Task Id
        lora_weights_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Lora Weights Path
        luna_input_type:
          anyOf:
          - $ref: '#/components/schemas/LunaInputTypeEnum'
          - type: 'null'
        luna_output_type:
          anyOf:
          - $ref: '#/components/schemas/LunaOutputTypeEnum'
          - type: 'null'
        class_name_to_vocab_ix:
          anyOf:
          - additionalProperties:
              items:
                type: integer
              type: array
              uniqueItems: true
            type: object
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Class Name To Vocab Ix
        decision_question:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Question
        decision_answer_options:
          anyOf:
          - items:
              type: string
            type: array
          - items:
              $ref: '#/components/schemas/DecisionChoice'
            type: array
          - items:
              $ref: '#/components/schemas/DecisionLevel'
            type: array
          - $ref: '#/components/schemas/DecisionBooleanCriteria'
          - type: 'null'
          title: Decision Answer Options
      type: object
      required:
      - id
      title: RuntimeScorerConfig
      description: 'Hydrated scorer config used at runtime. Never persisted directly.


        Produced by hydrate_scorer_config from a StoredScorerConfig + live DB rows.'
    MultimodalCapability:
      type: string
      enum:
      - vision
      - audio
      title: MultimodalCapability
    NumericRollUpMethod:
      type: string
      enum:
      - average
      - sum
      - max
      - min
      title: NumericRollUpMethod
      description: Roll up methods for aggregating numeric metrics up the session/trace/span hierarchy.
    CategoricalRollUpMethod:
      type: string
      enum:
      - category_count
      title: CategoricalRollUpMethod
      description: Roll up methods for aggregating categorical metrics up the session/trace/span hierarchy.
    ScorerInvocationPayloadFormat:
      type: string
      enum:
      - query
      - response
      - pairwise
      - node_input_output
      title: ScorerInvocationPayloadFormat
    PlaygroundSnapshotResponse:
      properties:
        id:
