      summary: Create Or Update Logstream Insights
      description: 'Create or update logstream insights for a project and log stream.


        Args:

        create_request: Insights to upsert.

        log_stream_id: Log stream the insights belong to.

        project: Project resolved from the URL.


        Returns:

        An empty acknowledgement.'
      operationId: create_or_update_logstream_insights_experimental_projects__project_id__log_streams__log_stream_id__logstream_insights_put
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: log_stream_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Log Stream Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogstreamInsightsCreateOrUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - logstream-insights
      summary: Delete Logstream Insights
      description: 'Delete logstream insights for a project and log stream.


        Args:

        log_stream_id: Log stream whose insights are deleted.

        project: Project resolved from the URL.


        Returns:

        An empty acknowledgement.'
      operationId: delete_logstream_insights_experimental_projects__project_id__log_streams__log_stream_id__logstream_insights_delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: log_stream_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Log Stream Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
