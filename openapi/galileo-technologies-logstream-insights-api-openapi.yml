openapi: 3.2.0
info:
  title: Galileo API Server Logstream Insights API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: logstream-insights
paths:
  /experimental/projects/{project_id}/log_streams/{log_stream_id}/signals:
    get:
      tags:
      - logstream-insights
      summary: List log stream signals
      description: Returns a cursor-paginated view of the current signals for one log stream. Rows are ordered by updated_at descending, and signal ID. Date filters apply to the signal's created_at value; when supplied, the time range cannot exceed 31 days. from_date and to_date are both optional and independent — omitting one leaves that side of the range unbounded, and omitting both returns signals from all time.
      operationId: list_signals_experimental_projects__project_id__log_streams__log_stream_id__signals_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: log_stream_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Log stream whose current signals should be listed.
          title: Log Stream Id
        description: Log stream whose current signals should be listed.
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: signal_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid4
            maxItems: 100
          - type: 'null'
          description: Return only signals whose ID matches any supplied value. Repeat this parameter to select multiple signals.
          title: Signal Id
        description: Return only signals whose ID matches any supplied value. Repeat this parameter to select multiple signals.
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/SignalSeverity-Input'
            maxItems: 3
          - type: 'null'
          description: Return signals matching any supplied derived severity. Repeat this parameter for multiple values. Priority 8-10 maps to critical, 4-7 to high, and 1-3 to medium.
          title: Severity
        description: Return signals matching any supplied derived severity. Repeat this parameter for multiple values. Priority 8-10 maps to critical, 4-7 to high, and 1-3 to medium.
      - name: from_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive start of the signal creation time range. Omit for no lower bound.
          examples:
          - '2026-08-01T00:00:00Z'
          title: From Date
        description: Inclusive start of the signal creation time range. Omit for no lower bound.
      - name: to_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Exclusive end of the signal creation time range. Omit for no upper bound.
          examples:
          - '2026-09-01T00:00:00Z'
          title: To Date
        description: Exclusive end of the signal creation time range. Omit for no upper bound.
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          description: Case-insensitive substring search across signal title and observation.
          title: Query
        description: Case-insensitive substring search across signal title and observation.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of signal rows to return. Use next_cursor to request the next page.
          default: 50
          title: Limit
        description: Maximum number of signal rows to return. Use next_cursor to request the next page.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1024
          - type: 'null'
          description: Token returned in next_cursor.
          title: Cursor
        description: Token returned in next_cursor.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalsListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /experimental/projects/{project_id}/log_streams/{log_stream_id}/signals/{signal_id}:
    get:
      tags:
      - logstream-insights
      summary: Get a log stream signal
      description: Returns one signal with its analysis and sampled occurrences.
      operationId: get_signal_experimental_projects__project_id__log_streams__log_stream_id__signals__signal_id__get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: signal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Signal ID.
          title: Signal Id
        description: Signal ID.
      - name: log_stream_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Log stream that owns the signal.
          title: Log Stream Id
        description: Log stream that owns the signal.
