          application/json:
            schema:
              $ref: '#/components/schemas/BaseAwsIntegrationCreate'
              examples:
              - credential_type: key_secret
                region: us-west-2
                inference_profiles: {}
                token:
                  aws_access_key_id: AWSA46AWSAWSBEDR0C45K
                  aws_secret_access_key: sagasg2t0-9527@$s1ashsahfahfddsg
              - credential_type: assumed_role
                region: us-west-1
                inference_profiles: {}
                token:
