      - ClassicAPIKeyHeader: []
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Integration Id
      responses:
        '200':
          description: Successful Response
