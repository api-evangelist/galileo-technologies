          items:
            oneOf:
            - $ref: '#/components/schemas/DatasetPrependRow'
            - $ref: '#/components/schemas/DatasetAppendRow'
            - $ref: '#/components/schemas/DatasetUpdateRow'
            - $ref: '#/components/schemas/DatasetDeleteRow'
