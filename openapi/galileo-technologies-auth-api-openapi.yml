                $ref: '#/components/schemas/Token'
      security:
      - ClassicAPIKeyHeader: []
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
  /verify_email:
    post:
      tags:
      - auth
      summary: Verify Email
      operationId: verify_email_verify_email_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: verification_token
        in: query
