openapi: 3.2.0
info:
  title: Galileo API Server Signals V2 API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: signals-v2
paths:
  /v2/projects/{project_id}/runs/{run_id}/signals:
    get:
      tags:
      - signals-v2
      summary: List Signals
      description: 'List top-level Signals for one log stream or experiment run.


        Results are ordered by internal priority and last seen time. Open Signals whose notifications

        are not muted are returned by default. A cursor may be reused only with the same filters.'
      operationId: list_signals_v2_projects__project_id__runs__run_id__signals_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          description: Case-insensitive title and problem search. An exact SIG-N value also matches the display key.
          title: Search
        description: Case-insensitive title and problem search. An exact SIG-N value also matches the display key.
      - name: labels
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          maxItems: 20
          description: Match Signals containing any selected label.
          title: Labels
        description: Match Signals containing any selected label.
      - name: severities
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SignalSeverityLevel'
          maxItems: 3
          description: Severity levels to include.
          title: Severities
        description: Severity levels to include.
      - name: statuses
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SignalStatus'
          maxItems: 2
          description: User-marked states to include. Defaults to open Signals.
          title: Statuses
        description: User-marked states to include. Defaults to open Signals.
      - name: notification_state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SignalNotificationStateFilter'
          description: Notification state to include. Defaults to Signals whose notifications are not muted.
          default: UNMUTED
        description: Notification state to include. Defaults to Signals whose notifications are not muted.
      - name: view
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SignalListView'
          - type: 'null'
          description: ACTIVE or ARCHIVED tab. When set, this replaces statuses and notification_state filters.
          title: View
        description: ACTIVE or ARCHIVED tab. When set, this replaces statuses and notification_state filters.
      - name: last_seen_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Include Signals last seen at or after this timestamp.
          title: Last Seen After
        description: Include Signals last seen at or after this timestamp.
      - name: last_seen_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Include Signals last seen before this timestamp.
          title: Last Seen Before
        description: Include Signals last seen before this timestamp.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 2048
          - type: 'null'
          description: Cursor returned by the previous page with the same filters.
          title: Cursor
        description: Cursor returned by the previous page with the same filters.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum Signals returned in one page.
          default: 50
          title: Limit
        description: Maximum Signals returned in one page.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/runs/{run_id}/signals/archive:
    patch:
      tags:
      - signals-v2
      summary: Archive Selected Signals
      description: Archive or restore selected Signals in one run.
