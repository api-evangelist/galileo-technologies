components:
  schemas:
    SignalOccurrenceOutcome:
      type: string
      enum:
      - SUCCEEDED
      - PARTIALLY_SUCCEEDED
      - FAILED
      - UNKNOWN
      title: SignalOccurrenceOutcome
      description: Outcome of the session containing an occurrence.
    SignalScanHistoryEntry:
      properties:
        affected_session_count:
          type: integer
          minimum: 0.0
          title: Affected Session Count
        analyzed_session_count:
          type: integer
          minimum: 0.0
          title: Analyzed Session Count
        exposed_session_count:
          type: integer
          minimum: 0.0
          title: Exposed Session Count
        scan_id:
          type: string
          format: uuid4
          title: Scan Id
        scan_number:
          type: integer
          minimum: 1.0
          title: Scan Number
        completed_at:
          type: string
          format: date-time
          title: Completed At
      additionalProperties: false
      type: object
      required:
      - affected_session_count
      - analyzed_session_count
      - exposed_session_count
      - scan_id
      - scan_number
      - completed_at
      title: SignalScanHistoryEntry
      description: Impact saved for the Signal by a finished scan.
    SignalScanStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - COMPLETED
      - FAILED
      title: SignalScanStatus
      description: Execution state of a Signal scan.
    SignalScanListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/SignalScanSummary'
          type: array
          title: Data
        meta:
          $ref: '#/components/schemas/SignalScanListMeta'
      additionalProperties: false
      type: object
      required:
      - data
      - meta
      title: SignalScanListResponse
    SignalMergeResponse:
      properties:
        data:
          $ref: '#/components/schemas/SignalMergeResult'
      additionalProperties: false
      type: object
      required:
