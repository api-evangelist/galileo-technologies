          - type: string
          - type: 'null'
          title: User Code
        can_copy_to_llm:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Can Copy To Llm
        scoreable_node_types:
          anyOf:
          - items:
              $ref: '#/components/schemas/NodeType'
            type: array
          - type: 'null'
          title: Scoreable Node Types
        cot_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Cot Enabled
        output_type:
          anyOf:
          - $ref: '#/components/schemas/OutputTypeEnum'
          - type: 'null'
        input_type:
          anyOf:
          - $ref: '#/components/schemas/InputTypeEnum'
          - type: 'null'
        multimodal_capabilities:
          anyOf:
          - items:
              $ref: '#/components/schemas/MultimodalCapability'
            type: array
          - type: 'null'
          title: Multimodal Capabilities
        requires_tools_in_llm_span:
          type: boolean
          title: Requires Tools In Llm Span
          default: false
        required_scorers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Required Scorers
        required_metric_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Required Metric Ids
        roll_up_strategy:
          anyOf:
          - $ref: '#/components/schemas/RollUpStrategy'
          - type: 'null'
        roll_up_methods:
          anyOf:
          - items:
              $ref: '#/components/schemas/NumericRollUpMethod'
            type: array
          - items:
              $ref: '#/components/schemas/CategoricalRollUpMethod'
            type: array
          - type: 'null'
          title: Roll Up Methods
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
        lora_task_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lora Task Id
        lora_weights_path:
          anyOf:
