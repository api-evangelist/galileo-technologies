      tags:
      - trace
      summary: Get Trace
      operationId: get_trace_projects__project_id__traces__trace_id__get
      security:
      - ClassicAPIKeyHeader: []
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Trace Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: include_presigned_urls
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Presigned Urls
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ExtendedTraceRecordWithChildren'
                - $ref: '#/components/schemas/StubTraceRecord'
                discriminator:
                  propertyName: type
                  mapping:
                    trace: '#/components/schemas/ExtendedTraceRecordWithChildren'
                    stub_trace: '#/components/schemas/StubTraceRecord'
                title: Response Get Trace Projects  Project Id  Traces  Trace Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
