      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ExtendedAgentSpanRecordWithChildren'
                - $ref: '#/components/schemas/ExtendedWorkflowSpanRecordWithChildren'
                - $ref: '#/components/schemas/ExtendedLlmSpanRecord'
                - $ref: '#/components/schemas/ExtendedToolSpanRecordWithChildren'
                - $ref: '#/components/schemas/ExtendedRetrieverSpanRecordWithChildren'
                - $ref: '#/components/schemas/ExtendedControlSpanRecord'
                discriminator:
                  propertyName: type
                  mapping:
                    agent: '#/components/schemas/ExtendedAgentSpanRecordWithChildren'
                    workflow: '#/components/schemas/ExtendedWorkflowSpanRecordWithChildren'
                    llm: '#/components/schemas/ExtendedLlmSpanRecord'
                    tool: '#/components/schemas/ExtendedToolSpanRecordWithChildren'
                    retriever: '#/components/schemas/ExtendedRetrieverSpanRecordWithChildren'
                    control: '#/components/schemas/ExtendedControlSpanRecord'
