        id:
          type: string
          format: uuid4
          title: ID
          description: Galileo ID of the session, trace or span
        session_id:
          type: string
          format: uuid4
          title: Session ID
          description: Galileo ID of the session containing the trace (or the same value as id for a trace)
        trace_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Trace ID
          description: Galileo ID of the trace containing the span (or the same value as id for a trace)
        project_id:
          type: string
          format: uuid4
          title: Project ID
          description: Galileo ID of the project associated with this trace or span
        run_id:
          type: string
          format: uuid4
          title: Run ID
          description: Galileo ID of the run (log stream or experiment) associated with this trace or span
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Updated
          description: Timestamp of the session or trace or span's last update
        has_children:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Children
          description: Whether or not this trace or span has child spans
        metrics_batch_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Metrics Batch Id
          description: Galileo ID of the metrics batch associated with this trace or span
        session_batch_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Session Batch Id
          description: Galileo ID of the metrics batch associated with this trace or span
        feedback_rating_info:
          additionalProperties:
            $ref: '#/components/schemas/FeedbackRatingInfo'
          type: object
          title: Feedback Rating Info
          description: Feedback information related to the record
        annotations:
          additionalProperties:
            additionalProperties:
              $ref: '#/components/schemas/AnnotationRatingInfo'
            propertyNames:
              format: uuid4
            type: object
          propertyNames:
            format: uuid4
          type: object
          title: Annotations
          description: Annotations keyed by template ID and annotator ID
        file_ids:
          items:
            type: string
            format: uuid4
          type: array
          title: File Ids
          description: IDs of files associated with this record
        file_modalities:
          items:
            $ref: '#/components/schemas/ContentModality'
          type: array
          title: File Modalities
          description: Modalities of files associated with this record
        annotation_aggregates:
          additionalProperties:
            $ref: '#/components/schemas/AnnotationAggregate'
          propertyNames:
            format: uuid4
          type: object
          title: Annotation Aggregates
          description: Annotation aggregate information keyed by template ID
        annotation_agreement:
          additionalProperties:
            type: number
          propertyNames:
            format: uuid4
          type: object
          title: Annotation Agreement
          description: Annotation agreement scores keyed by template ID
        overall_annotation_agreement:
          anyOf:
          - type: number
          - type: 'null'
          title: Overall Annotation Agreement
          description: Average annotation agreement across all templates in the queue
        annotation_queue_ids:
          items:
            type: string
            format: uuid4
          type: array
          title: Annotation Queue Ids
          description: IDs of annotation queues this record is in
        fully_annotated:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Fully Annotated
          description: Whether every field is annotated by every annotator in the queue
        progress_message:
          type: string
          title: Progress Message
          description: Runner progress text written directly to CH span
          default: ''
        error_message:
          type: string
          title: Error Message
          description: Runner error text written directly to CH span
          default: ''
        metric_info:
          anyOf:
          - additionalProperties:
              oneOf:
              - $ref: '#/components/schemas/MetricNotComputed'
              - $ref: '#/components/schemas/MetricPending'
              - $ref: '#/components/schemas/MetricComputing'
              - $ref: '#/components/schemas/MetricNotApplicable'
              - $ref: '#/components/schemas/MetricSuccess'
              - $ref: '#/components/schemas/MetricError'
              - $ref: '#/components/schemas/MetricFailed'
              - $ref: '#/components/schemas/MetricRollUp'
              discriminator:
                propertyName: status_type
                mapping:
                  computing: '#/components/schemas/MetricComputing'
                  error: '#/components/schemas/MetricError'
                  failed: '#/components/schemas/MetricFailed'
                  not_applicable: '#/components/schemas/MetricNotApplicable'
                  not_computed: '#/components/schemas/MetricNotComputed'
                  pending: '#/components/schemas/MetricPending'
                  roll_up: '#/components/schemas/MetricRollUp'
                  success: '#/components/schemas/MetricSuccess'
            type: object
          - type: 'null'
          title: Metric Info
          description: Detailed information about the metrics associated with this trace or span
        files:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/FileMetadata'
            propertyNames:
              format: uuid4
            type: object
          - type: 'null'
          title: Files
          description: File metadata keyed by file ID for files associated with this record
        parent_id:
          type: string
          format: uuid4
          title: Parent ID
          description: Galileo ID of the parent of this span
        is_complete:
          type: boolean
          title: Is Complete
          description: Whether the parent trace is complete or not
          default: true
        step_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Step Number
          description: Topological step number of the span.
        tool_call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Call Id
          description: ID of the tool call.
      type: object
      required:
      - id
      - session_id
      - project_id
      - run_id
      - parent_id
      title: ExtendedToolSpanRecord
    CategoricalMetricInfo:
      properties:
        aggregation_type:
          type: string
          const: categorical
          title: Aggregation Type
          description: 'Discriminator: categorical metrics aggregated as per-label counts'
          default: categorical
        name:
          type: string
          title: Name
          description: Unique identifier for the metric
        label:
          type: string
          title: Label
          description: Human-readable display name for the metric
        category_counts:
          additionalProperties:
            type: integer
          type: object
          title: Category Counts
          description: Count of occurrences per category label across records
      type: object
      required:
      - name
      - label
      title: CategoricalMetricInfo
  securitySchemes:
    ClassicAPIKeyHeader:
