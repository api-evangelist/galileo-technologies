openapi: 3.1.0
info:
  title: Galileo API Server annotation trace API
  version: 1.1085.0
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: trace
paths:
  /projects/{project_id}/traces/aggregated:
    post:
      tags:
      - trace
      summary: Get Aggregated Trace View
      operationId: get_aggregated_trace_view_projects__project_id__traces_aggregated_post
      security:
      - ClassicAPIKeyHeader: []
      - APIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregatedTraceViewRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedTraceViewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/recompute-metrics:
    post:
      tags:
      - trace
      summary: Recompute Metrics
      operationId: recompute_metrics_projects__project_id__recompute_metrics_post
