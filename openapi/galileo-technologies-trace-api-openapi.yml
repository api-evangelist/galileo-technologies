        pagination:
          limit: 5
          starting_token: 0
        sort:
          ascending: false
          name: updated_at
          sort_type: column
      - filter_tree:
          and:
          - or:
            - filter:
                name: input
                operator: contains
                type: text
                value: abx
            - filter:
                name: output
                operator: contains
                type: text
                value: xyz
          - filter:
