          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRatingDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Feedback
      summary: Get Feedback Rating V2
      description: 'Get a v2 feedback rating for a trace.


        Args:

        trace_id: Trace the rating is for.

        project: The project the trace belongs to, resolved from the URL.

        feedback_template: The template the rating was recorded against, resolved from the URL.


        Returns:

        The feedback rating.'
      operationId: get_feedback_rating_v2_v2_projects__project_id__feedback_templates__template_id__traces__trace_id__rating_get
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: trace_id
