      operationId: update_feedback_template_v2_projects__project_id__feedback_templates__template_id__patch
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
