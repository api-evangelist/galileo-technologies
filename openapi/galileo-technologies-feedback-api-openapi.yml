          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Criteria
        constraints:
          oneOf:
          - $ref: '#/components/schemas/libs__python__schemas__log_records__feedback__LikeDislikeConstraints'
          - $ref: '#/components/schemas/libs__python__schemas__log_records__feedback__StarConstraints'
          - $ref: '#/components/schemas/libs__python__schemas__log_records__feedback__ScoreConstraints'
          - $ref: '#/components/schemas/libs__python__schemas__log_records__feedback__TagsConstraints'
          - $ref: '#/components/schemas/libs__python__schemas__log_records__feedback__TextConstraints'
          - $ref: '#/components/schemas/libs__python__schemas__log_records__feedback__ChoiceConstraints'
          - $ref: '#/components/schemas/TreeChoiceConstraints-Output'
          title: Constraints
          discriminator:
            propertyName: feedback_type
            mapping:
              choice: '#/components/schemas/libs__python__schemas__log_records__feedback__ChoiceConstraints'
              like_dislike: '#/components/schemas/libs__python__schemas__log_records__feedback__LikeDislikeConstraints'
              score: '#/components/schemas/libs__python__schemas__log_records__feedback__ScoreConstraints'
              star: '#/components/schemas/libs__python__schemas__log_records__feedback__StarConstraints'
              tags: '#/components/schemas/libs__python__schemas__log_records__feedback__TagsConstraints'
              text: '#/components/schemas/libs__python__schemas__log_records__feedback__TextConstraints'
              tree_choice: '#/components/schemas/TreeChoiceConstraints-Output'
        id:
          type: string
          format: uuid4
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        created_by:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Created By
        position:
          type: integer
          title: Position
        usage_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Usage Count
          description: Number of feedback ratings using the template.
      type: object
      required:
      - name
      - include_explanation
      - constraints
      - id
      - created_at
      - created_by
      - position
      title: FeedbackTemplateDB
    FeedbackTemplateReorder:
