  /v2/projects/{project_id}/feedback/ratings:
    post:
      tags:
      - Feedback
      summary: Apply Bulk Feedback V2
      description: 'Record multiple v2 feedback ratings across traces in one request.


        Args:

        request: The set of rating operations (create or delete) to apply, and which traces.

        project: The project the traces belong to, resolved from the URL.

        ctx: Async request context.


        Returns:

        One status per requested trace/operation pair, indicating success or the reason for failure.'
      operationId: apply_bulk_feedback_v2_v2_projects__project_id__feedback_ratings_post
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFeedbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkFeedbackRatingStatus'
                title: Response Apply Bulk Feedback V2 V2 Projects  Project Id  Feedback Ratings Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /public/v2/projects/{project_id}/feedback/templates:
    post:
      tags:
      - Feedback
      summary: Create Feedback Template V2
      description: 'Create a v2 feedback template for a GenAI project.


        Args:

        project: The project to create the template in, resolved from the URL.

        feedback_template_create: Name, criteria, and rating constraints for the template.

