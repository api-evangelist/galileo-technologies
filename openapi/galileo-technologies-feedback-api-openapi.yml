                $ref: '#/components/schemas/FeedbackTemplateDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Feedback
      summary: Get Feedback Template V2
      description: 'Get a v2 feedback template with its usage count.


        Args:

        project: The project the template belongs to, resolved from the URL.

        template: The template to return, resolved from the URL.


        Returns:

        The feedback template, including how many ratings reference it.'
      operationId: get_feedback_template_v2_v2_projects__project_id__feedback_templates__template_id__get
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackTemplateDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Feedback
      summary: Delete Feedback Template
      description: 'Delete a feedback template.


        Args:

        project: The project the template belongs to, resolved from the URL. Unused directly;

        present so the permission dependency and 404 scoping run against the right project.

        template: The template to delete, resolved from the URL.

        ctx: Async request context.


        Returns:

        A confirmation message.'
      operationId: delete_feedback_template_v2_projects__project_id__feedback_templates__template_id__delete
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/feedback/templates/reorder:
    post:
      tags:
      - Feedback
      summary: Reorder Feedback Templates
      description: 'Reorder all feedback templates within a project.


        Args:

        project_id: Project whose templates are being reordered, resolved from the URL.

        feedback_template_reorder: The full, new ordering of template IDs.

        ctx: Async request context.


        Returns:

        A confirmation message.


        Raises:

        GalileoServerException: 400 if the ordering omits or adds templates relative to the project''s current set.'
      operationId: reorder_feedback_templates_v2_projects__project_id__feedback_templates_reorder_post
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackTemplateReorder'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/feedback/templates/{template_id}/traces/{trace_id}/rating:
    put:
      tags:
      - Feedback
      summary: Create Feedback Rating V2
      description: 'Record a v2 feedback rating for a trace.


        Args:

        trace_id: Trace the rating is for.

        feedback_rating_create: The rating value, validated against the template''s constraints.

        project: The project the trace belongs to, resolved from the URL.

        ctx: Async request context.

        feedback_template: The template the rating is validated and stored against, resolved from the URL.


        Returns:

        The stored feedback rating.


        Raises:

        HTTPException: 422 if the rating value is invalid for the template''s constraints.'
      operationId: create_feedback_rating_v2_v2_projects__project_id__feedback_templates__template_id__traces__trace_id__rating_put
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Trace Id
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRatingCreate'
      responses:
        '200':
