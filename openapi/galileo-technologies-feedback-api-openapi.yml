        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackTemplateCreate'
              examples:
              - name: creativity
                criteria: How creative was the response?
                constraints:
                  feedback_type: score
                  min: 1
                  max: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackTemplateDB'
        '422':
          description: Validation Error
          content:
            application/json:
