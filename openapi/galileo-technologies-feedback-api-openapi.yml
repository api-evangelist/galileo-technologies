openapi: 3.2.0
info:
  title: Galileo API Server Feedback API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: Feedback
paths:
  /projects/{project_id}/feedback/templates/{template_id}:
    patch:
      tags:
      - Feedback
      summary: Update Feedback Template
      description: 'Update a feedback template''s name and/or rating constraints.


        Args:

        feedback_template_update: Fields to update.

        project: The project the template belongs to, resolved from the URL.

        template: The template to update, resolved from the URL.

        ctx: Async request context.


        Returns:

        The updated feedback template.


        Raises:

        GalileoServerException: 400 if renaming to a name already used by another template in the project.'
      operationId: update_feedback_template_projects__project_id__feedback_templates__template_id__patch
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackTemplateUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackTemplateDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Feedback
      summary: Get Feedback Template
      description: 'Get a feedback template by ID.


        Args:

        template: The template to return, resolved from the URL.


        Returns:

        The feedback template.'
      operationId: get_feedback_template_projects__project_id__feedback_templates__template_id__get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackTemplateDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Feedback
      summary: Delete Feedback Template
      description: 'Delete a feedback template.


        Args:

        project: The project the template belongs to, resolved from the URL. Unused directly;

        present so the permission dependency and 404 scoping run against the right project.

        template: The template to delete, resolved from the URL.

        ctx: Async request context.


        Returns:

        A confirmation message.'
      operationId: delete_feedback_template_projects__project_id__feedback_templates__template_id__delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/feedback/templates:
    get:
      tags:
      - Feedback
      summary: List Feedback Templates
      description: 'List all feedback templates for a project, ordered by position.


        Args:

        project_id: Project to list templates for, resolved from the URL.

        ctx: Async request context.


        Returns:

        The project''s feedback templates.'
      operationId: list_feedback_templates_projects__project_id__feedback_templates_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackTemplateDB'
                title: Response List Feedback Templates Projects  Project Id  Feedback Templates Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/runs/{run_id}/feedback/templates/{template_id}/index/{index}/rating:
    put:
      tags:
      - Feedback
      summary: Create Feedback Rating
      description: Record a feedack rating for a specific sample in a run. For prompt chains, the index must be the root node.
      operationId: create_feedback_rating_projects__project_id__runs__run_id__feedback_templates__template_id__index__index__rating_put
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      - name: index
        in: path
        required: true
        schema:
          type: integer
          title: Index
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRatingCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRatingDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Feedback
      summary: Get Feedback Rating
      description: 'Get a feedback rating by run, template, and sample index.


        Args:

        project_id: Project the run belongs to, resolved from the URL.

        run_id: Run the rating is for.

        index: Sample index within the run.

        feedback_template: The template the rating was recorded against, resolved from the URL.

        ctx: Async request context.


        Returns:

        The feedback rating.


        Raises:

        GalileoServerException: 404 if the run does not belong to the project.'
      operationId: get_feedback_rating_projects__project_id__runs__run_id__feedback_templates__template_id__index__index__rating_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      - name: index
        in: path
        required: true
        schema:
          type: integer
          title: Index
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackRatingDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Feedback
      summary: Delete Feedback Rating
      description: 'Delete a feedback rating by run, template, and sample index.


        Args:

        project_id: Project the run belongs to, resolved from the URL.

        run_id: Run the rating is for.

        template_id: Template the rating was recorded against; used only in the response message.

        index: Sample index within the run.

        ctx: Async request context.

        feedback_template: The template the rating was recorded against, resolved from the URL.


        Returns:

        A confirmation message.'
      operationId: delete_feedback_rating_projects__project_id__runs__run_id__feedback_templates__template_id__index__index__rating_delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Template Id
      - name: index
        in: path
        required: true
        schema:
          type: integer
          title: Index
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/runs/{run_id}/ratings:
    post:
      tags:
      - Feedback
      summary: Apply Bulk Feedback
      description: Record multiple feedback ratings
      operationId: apply_bulk_feedback_projects__project_id__runs__run_id__ratings_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFeedbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkFeedbackRatingStatus'
                title: Response Apply Bulk Feedback Projects  Project Id  Runs  Run Id  Ratings Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/feedback/templates:
    post:
      tags:
      - Feedback
      summary: Create Feedback Template V2
      description: 'Create a v2 feedback template for a GenAI project.


        Args:

        project: The project to create the template in, resolved from the URL.

        feedback_template_create: Name, criteria, and rating constraints for the template.

        ctx: Async request context.


        Returns:

        The created feedback template.


        Raises:

        HTTPException: 400 if the project is not a GenAI project.

        GalileoServerException: 400 if a template with this name already exists for the project.'
      operationId: create_feedback_template_v2_v2_projects__project_id__feedback_templates_post
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackTemplateCreate'
              examples:
              - name: creativity
                criteria: How creative was the response?
                constraints:
                  feedback_type: score
                  min: 1
                  max: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackTemplateDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Feedback
      summary: List Feedback Templates V2
      description: 'List all v2 feedback templates for a project, each with its usage count.


        Args:

        project_id: Project to list templates for, resolved from the URL.

        ctx: Async request context.


        Returns:

        The project''s feedback templates, including how many ratings reference each one.'
      operationId: list_feedback_templates_v2_v2_projects__project_id__feedback_templates_get
      deprecated: true
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackTemplateDB'
                title: Response List Feedback Templates V2 V2 Projects  Project Id  Feedback Templates Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/projects/{project_id}/feedback/templates/{template_id}:
