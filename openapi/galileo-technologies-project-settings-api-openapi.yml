      - Detects a significant shift in the user's primary conversational goal or workflow during a session that includes audio.
      - Evaluates whether the SQL query semantically adheres to the natural language query.
      - 'Evaluates the SQL query on two independent binary dimensions: syntactic correctness and schematic adherence.'
      - Evaluates whether the SQL query is structurally efficient and free of common performance anti-patterns.
      - Detects SQL injection risks and other security exploits in the query.
      - Measures the coherence of the reasoning process by evaluating the consistency and logical flow of the reasoning steps.
      - Measures the coherence of the reasoning process by evaluating the consistency and logical flow of reasoning steps with image or document context.
      - Measures the coherence of the reasoning process by evaluating the consistency and logical flow of reasoning steps with audio context.
      - Determines whether the input image / PDF is of sufficient quality to complete the given task.
      - Evaluates whether the generated image / PDF complies with the provided rules.
      - Identifies barge-ins by the user or the LLM in an audio conversation.
      title: MetricDescriptions
    AlertsConfiguration:
      properties:
        emails:
          items:
            type: string
            format: email
          type: array
          title: Emails
        webhooks:
          items:
            $ref: '#/components/schemas/Webhook'
          type: array
          title: Webhooks
      type: object
      title: AlertsConfiguration
    MetricWeight:
      properties:
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        group_label:
          anyOf:
          - $ref: '#/components/schemas/GroupLabel'
          - type: 'null'
        description:
          anyOf:
          - $ref: '#/components/schemas/MetricDescriptions'
          - type: 'null'
        weight:
          type: number
          title: Weight
          default: 0.5
      type: object
      title: MetricWeight
    Webhook:
      properties:
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
        status:
          $ref: '#/components/schemas/WebhookStatus'
          default: untested
        notes:
          type: string
          maxLength: 255
          title: Notes
          default: ''
      type: object
      required:
      - url
      title: Webhook
    GenAIProjectSettings:
      properties:
        metric_weights_configuration:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/MetricWeight'
            type: object
          - type: 'null'
          title: Metric Weights Configuration
        alerts_configuration:
          anyOf:
          - $ref: '#/components/schemas/AlertsConfiguration'
          - type: 'null'
        rate_limit_configuration:
          anyOf:
          - $ref: '#/components/schemas/RateLimitConfiguration'
          - type: 'null'
      type: object
      title: GenAIProjectSettings
    ProjectSettingsDB:
      properties:
        metric_weights_configuration:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/MetricWeight'
            type: object
          - type: 'null'
          title: Metric Weights Configuration
        alerts_configuration:
          anyOf:
          - $ref: '#/components/schemas/AlertsConfiguration'
          - type: 'null'
        rate_limit_configuration:
          anyOf:
          - $ref: '#/components/schemas/RateLimitConfiguration'
          - type: 'null'
        project_id:
          type: string
          format: uuid4
          title: Project Id
        id:
          type: string
          format: uuid4
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - project_id
      - id
      - created_at
      - updated_at
      title: ProjectSettingsDB
    GroupLabel:
      type: string
      enum:
      - Input Quality
      - Output Quality
      - Configuration
      - LLM Parameters
      - RAG Quality
      - RAG Parameters
      - Generic Parameters
      - Safety Metrics
      - Protect
      - System Metrics
      - Rating Summary
      - Annotation Agreement
      - Custom Metrics
      - Security
      - Dataset
      - Agent Quality
      - Text to SQL Metrics
      title: GroupLabel
      description: Group labels for prompt rows.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RateLimitConfiguration:
      properties:
        spans_per_minute:
          type: integer
          maximum: 1000000000.0
          minimum: 0.0
          title: Spans Per Minute
          description: Spans per minute this project may ingest. 0 means unlimited (exempt from the global default).
        burst:
          type: integer
          maximum: 1000000000.0
          minimum: 0.0
          title: Burst
          description: Total burst capacity in spans, not an allowance on top of spans_per_minute. The most this project may ingest at one moment, and the cap on the spans one request may carry.
      type: object
      required:
      - spans_per_minute
      - burst
      title: RateLimitConfiguration
      description: 'Per-project ingestion rate limit: spans/minute plus a burst allowance.


        All-or-nothing: an override wholly replaces the global default, so both fields are

        required. ``spans_per_minute = 0`` means unlimited (exempt from the global default),

        not "reject everything".'
    GenAIProjectSettingsUpdate:
      properties:
        metric_weights_configuration:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/MetricWeightUpdate'
            type: object
          - type: 'null'
          title: Metric Weights Configuration
        alerts_configuration:
          anyOf:
          - $ref: '#/components/schemas/AlertsConfiguration'
          - type: 'null'
        rate_limit_configuration:
          anyOf:
          - $ref: '#/components/schemas/RateLimitConfiguration'
          - type: 'null'
      type: object
      title: GenAIProjectSettingsUpdate
    WebhookStatus:
      type: string
      enum:
      - active
      - untested
      - failed
      - paused
      title: WebhookStatus
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Splunk-AO-API-Key
    ClassicAPIKeyHeader:
      type: apiKey
      in: header
      name: Galileo-API-Key
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: https://api.galileo.ai/login
    HTTPBasic:
      type: http
      scheme: basic
