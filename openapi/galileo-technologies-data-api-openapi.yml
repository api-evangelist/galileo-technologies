          format: uuid4
          title: Scorer Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomLunaScorerVersionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
