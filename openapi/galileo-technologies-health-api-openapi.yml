openapi: 3.2.0
info:
  title: Galileo API Server Health API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: Health
paths:
  /healthcheck:
    get:
      tags:
      - Health
      summary: Healthcheck
      operationId: healthcheck_healthcheck_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
  /healthcheck/postgres:
    get:
      tags:
      - Health
      summary: Postgres Healthcheck
      description: 'PostgreSQL health check for external monitoring.


        Executes SELECT 1 query to verify database connectivity.

        Returns 200 if healthy, 503 if unhealthy.'
      operationId: postgres_healthcheck_healthcheck_postgres_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /healthcheck/clickhouse:
    get:
      tags:
      - Health
      summary: Clickhouse Healthcheck
      description: 'Data-service-backed ClickHouse health check for external monitoring.


        Checks data-service readiness, including its ClickHouse connectivity.

        Returns 200 if healthy, 503 if unhealthy.'
      operationId: clickhouse_healthcheck_healthcheck_clickhouse_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/healthcheck:
    get:
      tags:
      - Health
      summary: Healthcheck
      operationId: healthcheck_v1_healthcheck_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
  /v2/healthcheck:
    get:
      tags:
      - Health
      summary: Healthcheck
      operationId: healthcheck_v2_healthcheck_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
  /public/v1/healthcheck:
    get:
      tags:
      - Health
      summary: Healthcheck
      operationId: healthcheck_public_v1_healthcheck_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
  /public/v2/healthcheck:
    get:
      tags:
      - Health
      summary: Healthcheck
      operationId: healthcheck_public_v2_healthcheck_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
components:
  schemas:
    HealthcheckResponse:
      properties:
        api_version:
          type: string
          title: Api Version
        message:
          type: string
          title: Message
        version:
          type: string
          title: Version
      type: object
      required:
      - api_version
      - message
      - version
      title: HealthcheckResponse
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Splunk-AO-API-Key
    ClassicAPIKeyHeader:
      type: apiKey
      in: header
      name: Galileo-API-Key
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: https://api.galileo.ai/login
    HTTPBasic:
      type: http
      scheme: basic
