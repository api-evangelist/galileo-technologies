components:
  schemas:
    RunInsightsSettingsSchema:
      properties:
        logstream:
          $ref: '#/components/schemas/LogstreamInsightConfig'
          description: Logstream insights configuration.
      type: object
      title: RunInsightsSettingsSchema
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RunInsightsRequest:
      properties:
        insights:
          $ref: '#/components/schemas/RunInsightsSettingsSchema'
          description: The insights configuration for the run.
      type: object
      title: RunInsightsRequest
    RunInsightsResponse:
      properties:
        insights:
          $ref: '#/components/schemas/RunInsightsSettingsSchema'
          description: The insights configuration for the run.
        run_id:
          type: string
          format: uuid4
          title: Run Id
          description: The ID of the run this settings belong to.
      type: object
      required:
      - run_id
      title: RunInsightsResponse
    LogstreamInsightConfig:
      properties:
        enabled:
          type: boolean
          title: Enabled
          description: Whether logstream insights are enabled for this run.
          default: false
        start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Time
          description: Start time for generating logstream insights.
      type: object
      title: LogstreamInsightConfig
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    ClassicAPIKeyHeader:
      type: apiKey
      in: header
      name: Galileo-API-Key
    APIKeyHeader:
      type: apiKey
      in: header
      name: Splunk-AO-API-Key
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: https://api.galileo.ai/login
    HTTPBasic:
      type: http
      scheme: basic
