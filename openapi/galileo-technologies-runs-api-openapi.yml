openapi: 3.2.0
info:
  title: Galileo API Server Runs API
  version: 0.0.0+orbit
servers:
- url: https://api.galileo.ai
  description: Galileo API Server - galileo-v2
tags:
- name: Runs
paths:
  /projects/{project_id}/runs:
    get:
      tags:
      - Runs
      summary: Get Project Runs
      description: Return all runs for a project, optionally filtered by name.
      operationId: get_project_runs_projects__project_id__runs_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunDB'
                title: Response Get Project Runs Projects  Project Id  Runs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Runs
      summary: Create Run
      description: 'Create a new run in the given project.


        Validates that no run with the same name exists, that the run''s task type

        is compatible with the project type, and that all existing runs share the

        same task type before delegating to the async run-creation service.'
      operationId: create_run_projects__project_id__runs_post
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
              examples:
              - name: my_first_run
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Runs
      summary: Delete Runs
      description: 'Delete multiple runs by ID.


        All requested run IDs must belong to the given project; the request is

        rejected if any run belongs to a different project.'
      operationId: delete_runs_projects__project_id__runs_delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRunsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRunsResponse'
        '409':
          description: 'Error 9009: deletion would remove the last view required by a restricted access level.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/runs/{run_id}:
    get:
      tags:
      - Runs
      summary: Get Run
      description: Return a single run by ID.
      operationId: get_run_projects__project_id__runs__run_id__get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDB'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Runs
      summary: Update Run
      description: Update a run's mutable fields (e.g. name).
      operationId: update_run_projects__project_id__runs__run_id__put
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Runs
      summary: Delete Run
      description: Delete a single run and its associated artifacts and jobs.
      operationId: delete_run_projects__project_id__runs__run_id__delete
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRunResponse'
        '409':
          description: 'Error 9009: deletion would remove the last view required by a restricted access level.'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /projects/{project_id}/runs/{run_id}/link:
    get:
      tags:
      - Runs
      summary: Get Run Link
      description: Return the console deep-link URL for a run.
      operationId: get_run_link_projects__project_id__runs__run_id__link_get
      security:
      - APIKeyHeader: []
      - ClassicAPIKeyHeader: []
      - OAuth2PasswordBearer: []
      - HTTPBasic: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Project Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLinkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DeleteRunResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: DeleteRunResponse
    DeleteRunsResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: DeleteRunsResponse
    OrganizationAction:
      type: string
      enum:
      - rename
      - delete
      - delete_log_data
      - read_settings
      - update_settings
      - read_cost_settings
      - read_ai_usage
      - read_ai_usage_organization
      - read_unredacted_data
      title: OrganizationAction
    ApiKeyAction:
      type: string
      enum:
      - update
      - delete
      title: ApiKeyAction
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RunTagDB:
      properties:
        key:
          type: string
          maxLength: 256
          title: Key
        value:
          type: string
          maxLength: 256
          title: Value
        tag_type:
          type: string
          title: Tag Type
        project_id:
          type: string
          format: uuid4
          title: Project Id
        run_id:
          type: string
          format: uuid4
          title: Run Id
        created_by:
          type: string
          format: uuid4
          title: Created By
        id:
          type: string
          format: uuid4
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - key
      - value
      - tag_type
      - project_id
      - run_id
      - created_by
      - id
      - created_at
      - updated_at
      title: RunTagDB
    AuthMethod:
      type: string
      enum:
      - email
      - google
      - github
      - okta
      - azure-ad
      - custom
      - saml
      - invite
      title: AuthMethod
    IntegrationAction:
      type: string
      enum:
      - update
      - delete
      - share
      - read_secrets
      title: IntegrationAction
    RegisteredScorerAction:
      type: string
      enum:
      - update
      - delete
      title: RegisteredScorerAction
    UserRole:
      type: string
      enum:
      - admin
      - manager
      - user
      - read_only
      - capability_based
      title: UserRole
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RunLinkResponse:
      properties:
        link:
          type: string
          title: Link
      type: object
      required:
      - link
      title: RunLinkResponse
    ProjectAction:
      type: string
      enum:
      - read_all_logs
      - read_filtered_logs
      - delete
      - rename
      - share
      - create_run
      - delete_run
      - rename_run
      - move_run
      - export_data
      - configure_human_feedback
      - record_human_feedback
      - log_data
      - toggle_metric
      - edit_alert
      - create_stage
      - edit_stage
      - configure_crown_logic
      - configure_rate_limit
      - delete_data
      - set_metric
      - edit_run_tags
      - dismiss_alert
      - edit_slice
      - edit_edit
      - update_control_bindings
      - use_control_runtime
      title: ProjectAction
    RunDB:
      properties:
        name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Name
        project_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Project Id
        created_by:
          type: string
          format: uuid4
          title: Created By
        num_samples:
          type: integer
          title: Num Samples
        winner:
          type: boolean
          title: Winner
        dataset_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Hash
        dataset_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Dataset Version Id
        prompt_template_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Prompt Template Version Id
        id:
          type: string
          format: uuid4
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        task_type:
          anyOf:
          - $ref: '#/components/schemas/TaskType'
          - type: 'null'
        last_updated_by:
          type: string
          format: uuid4
          title: Last Updated By
        run_tags:
          items:
            $ref: '#/components/schemas/RunTagDB'
          type: array
          title: Run Tags
        example_content_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Example Content Id
        creator:
          $ref: '#/components/schemas/UserDB'
        logged_splits:
          items:
            type: string
          type: array
          title: Logged Splits
        logged_inference_names:
          items:
            type: string
          type: array
          title: Logged Inference Names
      type: object
      required:
      - created_by
      - num_samples
      - winner
      - id
      - created_at
      - updated_at
      - last_updated_by
      - creator
      title: RunDB
    DeleteRunsRequest:
      properties:
        run_ids:
          items:
            type: string
            format: uuid4
          type: array
          title: Run Ids
      type: object
      required:
      - run_ids
      title: DeleteRunsRequest
    GroupAction:
      type: string
      enum:
      - update
      - list_members
      - join
      - request_to_join
      title: GroupAction
    ControlResourceAction:
      type: string
      enum:
      - create
      - read
      - update
      - delete
      title: ControlResourceAction
      description: Actions on Agent Control's org-scoped ``control`` resource.
    RunCreate:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
        project_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Project Id
        created_by:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Created By
        num_samples:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Samples
        winner:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Winner
        dataset_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Hash
        dataset_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Dataset Version Id
        prompt_template_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Prompt Template Version Id
        task_type:
          type: integer
          title: Task Type
        run_tags:
          items:
            $ref: '#/components/schemas/RunTagCreateRequest'
          type: array
          title: Run Tags
      type: object
      required:
      - name
      - task_type
      title: RunCreate
    GeneratedScorerAction:
      type: string
      enum:
      - update
      - delete
      title: GeneratedScorerAction
    FineTunedScorerAction:
      type: string
      enum:
      - update
      - delete
      title: FineTunedScorerAction
    RunUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Name
      type: object
      title: RunUpdateRequest
    UserDB:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        permissions:
          items:
            $ref: '#/components/schemas/Permission'
          type: array
          title: Permissions
          default: []
        email:
          type: string
          title: Email
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          default: ''
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          default: ''
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
          default: email
        role:
          $ref: '#/components/schemas/UserRole'
          default: read_only
        email_is_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Email Is Verified
        organization_id:
          type: string
          format: uuid4
          title: Organization Id
        organization_name:
          type: string
          title: Organization Name
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - email
      - organization_id
      - organization_name
      - created_at
      - updated_at
      title: UserDB
    RunTagCreateRequest:
      properties:
        key:
          type: string
          maxLength: 256
          title: Key
        value:
          type: string
          maxLength: 256
          title: Value
        tag_type:
          type: string
          title: Tag Type
      type: object
      required:
      - key
      - value
      - tag_type
      title: RunTagCreateRequest
    ScorerAction:
      type: string
      enum:
      - create_shared
      - create_global
      - update
      - delete
      - share
      - export
      - autotune_apply
      title: ScorerAction
    UserAction:
      type: string
      enum:
      - update
      - delete
      - read_api_keys
      - change_role_to_admin
      - change_role_to_manager
      - change_role_to_user
      - change_role_to_read_only
      - change_role_to_capability_based
      title: UserAction
    CreateRunResponse:
      properties:
        name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Name
        project_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Project Id
        created_by:
          type: string
          format: uuid4
          title: Created By
        num_samples:
          type: integer
          title: Num Samples
        winner:
          type: boolean
          title: Winner
        dataset_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Hash
        dataset_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Dataset Version Id
        prompt_template_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Prompt Template Version Id
        id:
          type: string
          format: uuid4
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        task_type:
          anyOf:
          - $ref: '#/components/schemas/TaskType'
          - type: 'null'
        last_updated_by:
          type: string
          format: uuid4
          title: Last Updated By
        run_tags:
          items:
            $ref: '#/components/schemas/RunTagDB'
          type: array
          title: Run Tags
      type: object
      required:
      - created_by
      - num_samples
      - winner
      - id
      - created_at
      - updated_at
      - last_updated_by
      title: CreateRunResponse
    TaskType:
      type: integer
      enum:
      - 13
      - 15
      - 16
      - 17
      - 18
      - 19
      title: TaskType
      description: 'Valid task types for modeling.


        We store these as ints instead of strings because we will be looking this up in the database frequently.'
    DatasetAction:
      type: string
      enum:
      - update
      - delete
      - share
      - export
      - rename
      title: DatasetAction
    AnnotationQueueAction:
      type: string
      enum:
      - update
      - delete
      - share
      - record_annotation
      title: AnnotationQueueAction
    GroupMemberAction:
      type: string
      enum:
      - update_role
      - delete
      title: GroupMemberAction
    Permission:
      properties:
        action:
          anyOf:
          - $ref: '#/components/schemas/UserAction'
          - $ref: '#/components/schemas/GroupAction'
          - $ref: '#/components/schemas/GroupMemberAction'
          - $ref: '#/components/schemas/ProjectAction'
          - $ref: '#/components/schemas/ScorerAction'
          - $ref: '#/components/schemas/RegisteredScorerAction'
          - $ref: '#/components/schemas/ApiKeyAction'
          - $ref: '#/components/schemas/GeneratedScorerAction'
          - $ref: '#/components/schemas/FineTunedScorerAction'
          - $ref: '#/components/schemas/DatasetAction'
          - $ref: '#/components/schemas/IntegrationAction'
          - $ref: '#/components/schemas/OrganizationAction'
          - $ref: '#/components/schemas/AnnotationQueueAction'
          - $ref: '#/components/schemas/ControlResourceAction'
          title: Action
        allowed:
          type: boolean
          title: Allowed
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      required:
      - action
      - allowed
      title: Permission
    UpdateRunResponse:
      properties:
        name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Name
        project_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Project Id
        created_by:
          type: string
          format: uuid4
          title: Created By
        num_samples:
          type: integer
          title: Num Samples
        winner:
          type: boolean
          title: Winner
        dataset_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Hash
        dataset_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Dataset Version Id
        prompt_template_version_id:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          title: Prompt Template Version Id
        id:
          type: string
          format: uuid4
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        task_type:
          anyOf:
          - $ref: '#/components/schemas/TaskType'
          - type: 'null'
        last_updated_by:
          type: string
          format: uuid4
          title: Last Updated By
        run_tags:
          items:
            $ref: '#/components/schemas/RunTagDB'
          type: array
          title: Run Tags
      type: object
      required:
      - created_by
      - num_samples
      - winner
      - id
      - created_at
      - updated_at
      - last_updated_by
      title: UpdateRunResponse
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Splunk-AO-API-Key
    ClassicAPIKeyHeader:
      type: apiKey
      in: header
      name: Galileo-API-Key
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: https://api.galileo.ai/login
    HTTPBasic:
      type: http
      scheme: basic
